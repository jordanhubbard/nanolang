operand_kinds:
  - {name: value-tag, encoding: u8}
  - {name: local, encoding: uleb}
  - {name: global, encoding: uleb}
  - {name: upvalue, encoding: uleb}
  - {name: constant, encoding: uleb}
  - {name: function, encoding: uleb}
  - {name: signature, encoding: uleb}
  - {name: import, encoding: uleb}
  - {name: layout, encoding: uleb}
  - {name: field, encoding: uleb}
  - {name: count, encoding: uleb}
  - {name: branch, encoding: sleb}
  - {name: immediate-i64, encoding: sleb}
  - {name: immediate-f64, encoding: f64}
  - {name: offset, encoding: uleb}
  - {name: align, encoding: uleb}
  - {name: trap-code, encoding: uleb}

# This schema is normative for v2 design work. Generators will consume it as
# instruction families replace the v1 hand-maintained enum and metadata table.
instruction_families:
  constants:
    - {name: const.i64, meaning: "Push a signed 64-bit integer immediate onto the stack.", operands: [immediate-i64], pops: [], pushes: [i64], ownership: none}
    - {name: const.f64, meaning: "Push a 64-bit floating-point immediate onto the stack.", operands: [immediate-f64], pops: [], pushes: [f64], ownership: none}
    - {name: const.pool, meaning: "Push a constant-pool entry onto the stack, retaining it.", operands: [constant], pops: [], pushes: [any], ownership: retain}
  stack:
    - {name: drop, meaning: "Discard the top stack value, releasing its ownership.", operands: [], pops: [any], pushes: [], ownership: release}
    - {name: dup, meaning: "Duplicate the top stack value, retaining the copy.", operands: [], pops: [any], pushes: [any, any], ownership: retain}
    - {name: swap, meaning: "Exchange the top two stack values.", operands: [], pops: [any, any], pushes: [any, any], ownership: move}
    - {name: pick, meaning: "Copy the value at a given depth to the top, retaining it.", operands: [count], pops: [], pushes: [any], ownership: retain}
    - {name: roll, meaning: "Rotate the value at a given depth to the top.", operands: [count], pops: [], pushes: [], ownership: move}
  variables:
    - {name: local.get, meaning: "Read an indexed local slot onto the stack, retaining it.", operands: [local], pops: [], pushes: [any], ownership: retain}
    - {name: local.set, meaning: "Write the top stack value into an indexed local slot.", operands: [local], pops: [any], pushes: [], ownership: move}
    - {name: global.get, meaning: "Read an indexed global slot onto the stack, retaining it.", operands: [global], pops: [], pushes: [any], ownership: retain}
    - {name: global.set, meaning: "Write the top stack value into an indexed global slot.", operands: [global], pops: [any], pushes: [], ownership: move}
    - {name: upvalue.get, meaning: "Read a captured upvalue onto the stack, retaining it.", operands: [upvalue], pops: [], pushes: [any], ownership: retain}
    - {name: upvalue.set, meaning: "Write the top stack value into a captured upvalue.", operands: [upvalue], pops: [any], pushes: [], ownership: move}
  integer:
    - {name: i64.add, meaning: "Add two signed 64-bit integers with wraparound.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.sub, meaning: "Subtract the top signed 64-bit integer from the next.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.mul, meaning: "Multiply two signed 64-bit integers with wraparound.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.div-s, meaning: "Divide two 64-bit integers using signed semantics.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.div-u, meaning: "Divide two 64-bit integers using unsigned semantics.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.rem-s, meaning: "Take the remainder of two 64-bit integers using signed semantics.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.rem-u, meaning: "Take the remainder of two 64-bit integers using unsigned semantics.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.and, meaning: "Bitwise AND two 64-bit integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.or, meaning: "Bitwise OR two 64-bit integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.xor, meaning: "Bitwise exclusive-OR two 64-bit integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.shl, meaning: "Shift a 64-bit integer left by the top operand's bit count.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.shr-s, meaning: "Arithmetic-shift a 64-bit integer right, preserving sign.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.shr-u, meaning: "Logical-shift a 64-bit integer right, filling with zero.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none}
    - {name: i64.add-carry, meaning: "Add two 64-bit integers with a carry-in, producing sum and carry-out.", operands: [], pops: [i64, i64, i64], pushes: [i64, i64], ownership: none}
    - {name: i64.sub-borrow, meaning: "Subtract two 64-bit integers with a borrow-in, producing difference and borrow-out.", operands: [], pops: [i64, i64, i64], pushes: [i64, i64], ownership: none}
    - {name: i64.mul-wide-s, meaning: "Multiply two 64-bit integers producing a signed 128-bit low/high pair.", operands: [], pops: [i64, i64], pushes: [i64, i64], ownership: none}
    - {name: i64.mul-wide-u, meaning: "Multiply two 64-bit integers producing an unsigned 128-bit low/high pair.", operands: [], pops: [i64, i64], pushes: [i64, i64], ownership: none}
  float:
    - {name: f64.add, meaning: "Add two 64-bit floating-point values.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none}
    - {name: f64.sub, meaning: "Subtract the top 64-bit float from the next.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none}
    - {name: f64.mul, meaning: "Multiply two 64-bit floating-point values.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none}
    - {name: f64.div, meaning: "Divide the next 64-bit float by the top float.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none}
  memory:
    - {name: mem.load8, meaning: "Load an 8-bit value from a computed address, zero-extending to i64.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none}
    - {name: mem.load16, meaning: "Load a 16-bit little-endian value from a computed address, zero-extending to i64.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none}
    - {name: mem.load32, meaning: "Load a 32-bit little-endian value from a computed address, zero-extending to i64.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none}
    - {name: mem.load64, meaning: "Load a 64-bit little-endian value from a computed address.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none}
    - {name: mem.store8, meaning: "Store the low 8 bits of a value to a computed address.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none}
    - {name: mem.store16, meaning: "Store the low 16 bits of a value little-endian to a computed address.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none}
    - {name: mem.store32, meaning: "Store the low 32 bits of a value little-endian to a computed address.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none}
    - {name: mem.store64, meaning: "Store a full 64-bit value little-endian to a computed address.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none}
  aggregate:
    - {name: aggregate.pack, meaning: "Pack operands into an aggregate using the named layout.", operands: [layout, count], pops: [many], pushes: [aggregate], ownership: move}
    - {name: aggregate.get, meaning: "Read a field from an aggregate, retaining the field value.", operands: [field], pops: [aggregate], pushes: [any], ownership: retain}
    - {name: aggregate.set, meaning: "Write a field of an aggregate, returning the updated aggregate.", operands: [field], pops: [aggregate, any], pushes: [aggregate], ownership: move}
    - {name: aggregate.tag, meaning: "Read the discriminant tag of an aggregate as an integer.", operands: [], pops: [aggregate], pushes: [i64], ownership: none}
  control:
    - {name: branch, meaning: "Jump unconditionally to the target instruction boundary.", operands: [branch], pops: [], pushes: [], ownership: none}
    - {name: branch.zero, meaning: "Jump to the target when the popped integer is zero.", operands: [branch], pops: [i64], pushes: [], ownership: none}
    - {name: branch.nonzero, meaning: "Jump to the target when the popped integer is non-zero.", operands: [branch], pops: [i64], pushes: [], ownership: none}
    - {name: call, meaning: "Call the named function using its verified signature.", operands: [function], pops: [signature-args], pushes: [signature-result], ownership: call}
    - {name: call.indirect, meaning: "Call a callable value against a declared signature.", operands: [signature], pops: [signature-args, callable], pushes: [signature-result], ownership: call}
    - {name: tail.call, meaning: "Tail-call the named function, replacing the current frame.", operands: [function], pops: [signature-args], pushes: [signature-result], ownership: call}
    - {name: call.import, meaning: "Call an imported function through the trap boundary using its signature.", operands: [import], pops: [signature-args], pushes: [signature-result], ownership: trap}
    - {name: return, meaning: "Return the signature result values to the caller.", operands: [], pops: [signature-result], pushes: [], ownership: return}
  trap:
    - {name: trap, meaning: "Invoke a host trap selected by code, consuming its arguments.", operands: [trap-code, count], pops: [many], pushes: [any], ownership: trap}
