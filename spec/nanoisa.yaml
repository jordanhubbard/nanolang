version: 2
architecture: local-stack-hybrid
encoding:
  # Opcodes are one-byte identifiers, not a running instruction count. The
  # primary plane holds identifiers 0x00..0xfe (primary_opcode_limit is the
  # exclusive upper bound of that range, not "the number of opcodes"). The
  # value 0xff is reserved as the extension prefix: it never names an
  # instruction on its own and instead escapes into the extended plane, where
  # the following byte selects an extended opcode 0x00..0xff. This keeps a
  # clean, non-overlapping way to grow the instruction set without renumbering
  # existing opcodes or conflating an opcode value with a count.
  opcode: u8
  primary_opcode_limit: 0xff   # exclusive upper bound of the primary plane
  extension_prefix: 0xff       # escape byte; not an opcode, not a count
  extended_opcode: u8          # second byte after the prefix
  byte_order: little

value_tags:
  - {name: void, code: 0x00}
  - {name: i64, code: 0x01}
  - {name: u8, code: 0x02}
  - {name: f64, code: 0x03}
  - {name: bool, code: 0x04}
  - {name: string, code: 0x05}
  - {name: bstring, code: 0x06}
  - {name: array, code: 0x07}
  - {name: record, code: 0x08}
  - {name: enum, code: 0x09}
  - {name: variant, code: 0x0a}
  - {name: funcref, code: 0x0b}
  - {name: tuple, code: 0x0c}
  - {name: hashmap, code: 0x0d}
  - {name: opaque, code: 0x0e}
  - {name: closure, code: 0x0f}

# v1 remains executable while v2 families are introduced. This inventory is
# generated into the active C metadata and prevents enum/table drift now.
legacy_opcodes:
  - {name: NOP, code: 0x00, operands: [], pops: 0, pushes: 0}
  - {name: PUSH_I64, code: 0x01, operands: [I64], pops: 0, pushes: 1}
  - {name: PUSH_F64, code: 0x02, operands: [F64], pops: 0, pushes: 1}
  - {name: PUSH_BOOL, code: 0x03, operands: [U8], pops: 0, pushes: 1}
  - {name: PUSH_STR, code: 0x04, operands: [U32], pops: 0, pushes: 1}
  - {name: PUSH_VOID, code: 0x05, operands: [], pops: 0, pushes: 1}
  - {name: PUSH_U8, code: 0x06, operands: [U8], pops: 0, pushes: 1}
  - {name: DUP, code: 0x07, operands: [], pops: 1, pushes: 2}
  - {name: POP, code: 0x08, operands: [], pops: 1, pushes: 0}
  - {name: SWAP, code: 0x09, operands: [], pops: 2, pushes: 2}
  - {name: ROT3, code: 0x0a, operands: [], pops: 3, pushes: 3}
  - {name: LOAD_LOCAL, code: 0x10, operands: [U16], pops: 0, pushes: 1}
  - {name: STORE_LOCAL, code: 0x11, operands: [U16], pops: 1, pushes: 0}
  - {name: LOAD_GLOBAL, code: 0x12, operands: [U32], pops: 0, pushes: 1}
