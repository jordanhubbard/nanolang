# Extended opcode plane. When a code byte equals the extension_prefix (0xff)
# the decoder does not treat it as an instruction; it reads one more byte and
# looks the pair up here. `ext_code` is the second byte (0x00..0xff), so the
# extended plane is fully independent of the primary plane and adds up to 256
# further opcodes without disturbing existing numbering. The plane is defined
# now (empty) so encoders, decoders, and generators share one clean escape
# convention; families migrate into it as v2 lands.
extended_opcodes: []

# Every operand a portable instruction takes names a kind declared here. No
# family embeds a raw encoding directly; symmetry means matching instructions
# reference the same kinds in the same order.
operand_kinds:
  - {name: value-tag, encoding: u8}
  - {name: local, encoding: uleb}
  - {name: global, encoding: uleb}
  - {name: upvalue, encoding: uleb}
  - {name: constant, encoding: uleb}
  - {name: function, encoding: uleb}
  - {name: signature, encoding: uleb}
  - {name: import, encoding: uleb}
  - {name: layout, encoding: uleb}
  - {name: field, encoding: uleb}
  - {name: count, encoding: uleb}
  - {name: offset, encoding: uleb}
  - {name: align, encoding: uleb}
  - {name: immediate-i64, encoding: sleb}
  - {name: immediate-f64, encoding: f64}
  - {name: trap-code, encoding: uleb}
  - {name: branch, encoding: sleb, justification: control-flow}
  # Compact operand encodings. Each is an encoding-only variant of a canonical
  # operand kind: it never changes an instruction's meaning or stack effect, it
  # only stores small values in fewer bytes. Assemblers pick the compact form
  # when a value fits; disassemblers always render the canonical operand, so
  # assembly text stays regular.
  - {name: small-constant, encoding: simm7, canonical: sleb, range: [-64, 63]}
  - {name: local-short, encoding: nibble, canonical: uleb, range: [0, 15]}
  - {name: compact, encoding: uimm8, canonical: uleb, range: [0, 255]}

# This schema is normative for v2 design work. Generators will consume it as
# instruction families replace the v1 hand-maintained enum and metadata table.
instruction_families:
  constants:
    - {name: const.i64, meaning: "Push a signed 64-bit integer literal.", operands: [immediate-i64], pops: [], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: const.f64, meaning: "Push a 64-bit IEEE-754 float literal.", operands: [immediate-f64], pops: [], pushes: [f64], ownership: none, justification: core-semantics}
    - {name: const.pool, meaning: "Push a constant loaded from the constant pool.", operands: [constant], pops: [], pushes: [any], ownership: retain, justification: representation}
  stack:
    - {name: drop, meaning: "Discard the top stack value.", operands: [], pops: [any], pushes: [], ownership: release, justification: execution-substrate}
    - {name: dup, meaning: "Duplicate the top stack value.", operands: [], pops: [any], pushes: [any, any], ownership: retain, justification: execution-substrate}
    - {name: swap, meaning: "Exchange the top two stack values.", operands: [], pops: [any, any], pushes: [any, any], ownership: move, justification: execution-substrate}
    - {name: pick, meaning: "Copy the value at a stack depth to the top.", operands: [count], pops: [], pushes: [any], ownership: retain, justification: execution-substrate}
    - {name: roll, meaning: "Rotate the value at a stack depth to the top.", operands: [count], pops: [], pushes: [], ownership: move, justification: execution-substrate}
  variables:
    - {name: local.get, meaning: "Read an indexed frame local onto the stack.", operands: [local], pops: [], pushes: [any], ownership: retain, justification: execution-substrate}
    - {name: local.set, meaning: "Store the top value into an indexed frame local.", operands: [local], pops: [any], pushes: [], ownership: move, justification: execution-substrate}
    - {name: global.get, meaning: "Read an indexed global onto the stack.", operands: [global], pops: [], pushes: [any], ownership: retain, justification: execution-substrate}
    - {name: global.set, meaning: "Store the top value into an indexed global.", operands: [global], pops: [any], pushes: [], ownership: move, justification: execution-substrate}
    - {name: upvalue.get, meaning: "Read a captured upvalue onto the stack.", operands: [upvalue], pops: [], pushes: [any], ownership: retain, justification: execution-substrate}
    - {name: upvalue.set, meaning: "Store the top value into a captured upvalue.", operands: [upvalue], pops: [any], pushes: [], ownership: move, justification: execution-substrate}
  integer:
    - {name: i64.add, meaning: "Add two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.sub, meaning: "Subtract the top integer from the next.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.mul, meaning: "Multiply two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.div-s, meaning: "Divide two integers as signed.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.div-u, meaning: "Divide two integers as unsigned.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.rem-s, meaning: "Take the signed remainder of two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.rem-u, meaning: "Take the unsigned remainder of two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.and, meaning: "Bitwise AND two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.or, meaning: "Bitwise OR two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.xor, meaning: "Bitwise XOR two integers.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.shl, meaning: "Shift an integer left by a count.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.shr-s, meaning: "Arithmetic (sign-filling) shift an integer right.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.shr-u, meaning: "Logical (zero-filling) shift an integer right.", operands: [], pops: [i64, i64], pushes: [i64], ownership: none, justification: core-semantics}
    - {name: i64.add-carry, meaning: "Add two integers with an incoming carry, producing sum and carry.", operands: [], pops: [i64, i64, i64], pushes: [i64, i64], ownership: none, justification: core-semantics}
    - {name: i64.sub-borrow, meaning: "Subtract two integers with an incoming borrow, producing difference and borrow.", operands: [], pops: [i64, i64, i64], pushes: [i64, i64], ownership: none, justification: core-semantics}
    - {name: i64.mul-wide-s, meaning: "Multiply two integers as signed into a 128-bit high/low pair.", operands: [], pops: [i64, i64], pushes: [i64, i64], ownership: none, justification: core-semantics}
    - {name: i64.mul-wide-u, meaning: "Multiply two integers as unsigned into a 128-bit high/low pair.", operands: [], pops: [i64, i64], pushes: [i64, i64], ownership: none, justification: core-semantics}
  float:
    - {name: f64.add, meaning: "Add two floats.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none, justification: core-semantics}
    - {name: f64.sub, meaning: "Subtract the top float from the next.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none, justification: core-semantics}
    - {name: f64.mul, meaning: "Multiply two floats.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none, justification: core-semantics}
    - {name: f64.div, meaning: "Divide two floats.", operands: [], pops: [f64, f64], pushes: [f64], ownership: none, justification: core-semantics}
  memory:
    - {name: mem.load8, meaning: "Load 8 bits from memory, zero-extended to an integer.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none, justification: representation}
    - {name: mem.load16, meaning: "Load 16 bits from memory, zero-extended to an integer.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none, justification: representation}
    - {name: mem.load32, meaning: "Load 32 bits from memory, zero-extended to an integer.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none, justification: representation}
    - {name: mem.load64, meaning: "Load 64 bits from memory into an integer.", operands: [offset, align], pops: [i64], pushes: [i64], ownership: none, justification: representation}
    - {name: mem.store8, meaning: "Store the low 8 bits of an integer to memory.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none, justification: representation}
    - {name: mem.store16, meaning: "Store the low 16 bits of an integer to memory.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none, justification: representation}
    - {name: mem.store32, meaning: "Store the low 32 bits of an integer to memory.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none, justification: representation}
    - {name: mem.store64, meaning: "Store all 64 bits of an integer to memory.", operands: [offset, align], pops: [i64, i64], pushes: [], ownership: none, justification: representation}
  aggregate:
    - {name: aggregate.pack, meaning: "Pack stacked fields into an aggregate of a declared layout.", operands: [layout, count], pops: [many], pushes: [aggregate], ownership: move, justification: representation}
    - {name: aggregate.get, meaning: "Read a field out of an aggregate.", operands: [field], pops: [aggregate], pushes: [any], ownership: retain, justification: representation}
    - {name: aggregate.set, meaning: "Write a field into an aggregate, yielding the updated aggregate.", operands: [field], pops: [aggregate, any], pushes: [aggregate], ownership: move, justification: representation}
    - {name: aggregate.tag, meaning: "Read the discriminant tag of an aggregate.", operands: [], pops: [aggregate], pushes: [i64], ownership: none, justification: representation}
  control:
    - {name: branch, meaning: "Jump unconditionally to a relative target.", operands: [branch], pops: [], pushes: [], ownership: none, justification: control-flow}
    - {name: branch.zero, meaning: "Jump to a relative target when the top integer is zero.", operands: [branch], pops: [i64], pushes: [], ownership: none, justification: control-flow}
    - {name: branch.nonzero, meaning: "Jump to a relative target when the top integer is nonzero.", operands: [branch], pops: [i64], pushes: [], ownership: none, justification: control-flow}
    - {name: call, meaning: "Call a function by index using its declared signature.", operands: [function], pops: [signature-args], pushes: [signature-result], ownership: call, justification: control-flow}
    - {name: call.indirect, meaning: "Call a callable value against a declared signature.", operands: [signature], pops: [signature-args, callable], pushes: [signature-result], ownership: call, justification: control-flow}
    - {name: tail.call, meaning: "Replace the current frame with a call to a function by index.", operands: [function], pops: [signature-args], pushes: [signature-result], ownership: call, justification: control-flow}
    - {name: call.import, meaning: "Call an imported host function by index.", operands: [import], pops: [signature-args], pushes: [signature-result], ownership: trap, justification: host-boundary}
    - {name: return, meaning: "Return from the current function with its signature result.", operands: [], pops: [signature-result], pushes: [], ownership: return, justification: control-flow}
  # Typed traps replace the special print, assert, and host opcodes so that
  # every side effect is one regular instruction with explicit stack effects
  # and ownership. The core suspends on a trap and the harness resumes it.
  trap:
    - {name: trap.print, meaning: "Write the top value to standard output through the host trap boundary.", operands: [], pops: [any], pushes: [], ownership: trap, justification: host-boundary}
    - {name: trap.println, meaning: "Write the top value and a newline through the host trap boundary.", operands: [], pops: [any], pushes: [], ownership: trap, justification: host-boundary}
    - {name: trap.assert, meaning: "Raise an assertion failure unless the top boolean is true.", operands: [], pops: [bool], pushes: [], ownership: trap, justification: host-boundary}
    - {name: trap.halt, meaning: "Stop execution through the host trap boundary.", operands: [], pops: [], pushes: [], ownership: trap, justification: host-boundary}
    - {name: trap.host, meaning: "Call an imported host function through the typed trap boundary.", operands: [import], pops: [signature-args], pushes: [signature-result], ownership: trap, justification: host-boundary}
    - {name: trap.dispatch, meaning: "Raise a typed extensible trap with an explicit argument count.", operands: [trap-code, count], pops: [many], pushes: [any], ownership: trap, justification: host-boundary}
  compact:
    # Compact constants: small signed integers encoded inline instead of a full
    # sleb/f64 immediate. Decodes to const.i64; the value range is bounded so
    # the encoding is unambiguous.
    - {name: const.i64.small, meaning: "Push a small signed 64-bit integer using its compact encoding.", operands: [small-constant], pops: [], pushes: [i64], ownership: none, canonical: const.i64, justification: encoding}
    # Short local forms: the first 16 frame locals addressed by an inline
    # nibble rather than a uleb operand. Decodes to local.get / local.set.
    - {name: local.get.short, meaning: "Read a short-indexed frame local onto the stack.", operands: [local-short], pops: [], pushes: [any], ownership: retain, canonical: local.get, justification: encoding}
    - {name: local.set.short, meaning: "Store the top value into a short-indexed frame local.", operands: [local-short], pops: [any], pushes: [], ownership: move, canonical: local.set, justification: encoding}
    # Compact general operands: a single-byte operand reused by any family
    # instruction whose sole operand is a small count/index. Decodes to the
    # canonical uleb-operand instruction with identical effect.
    - {name: pick.compact, meaning: "Copy a compactly encoded stack-depth value to the top.", operands: [compact], pops: [], pushes: [any], ownership: retain, canonical: pick, justification: encoding}
    - {name: roll.compact, meaning: "Rotate a compactly encoded stack-depth value to the top.", operands: [compact], pops: [], pushes: [], ownership: move, canonical: roll, justification: encoding}
    - {name: global.get.compact, meaning: "Read a compactly indexed global onto the stack.", operands: [compact], pops: [], pushes: [any], ownership: retain, canonical: global.get, justification: encoding}
    - {name: global.set.compact, meaning: "Store the top value into a compactly indexed global.", operands: [compact], pops: [any], pushes: [], ownership: move, canonical: global.set, justification: encoding}
    - {name: aggregate.get.compact, meaning: "Read a compactly indexed field out of an aggregate.", operands: [compact], pops: [aggregate], pushes: [any], ownership: retain, canonical: aggregate.get, justification: encoding}
    - {name: aggregate.set.compact, meaning: "Write a compactly indexed field into an aggregate.", operands: [compact], pops: [aggregate, any], pushes: [aggregate], ownership: move, canonical: aggregate.set, justification: encoding}

# Runtime-library boundary for the v2 Portable ISA.
#
# Trimming, case conversion, splitting, replacement, formatting, parsing, and
# collection algorithms are NOT portable instructions. The normative
# instruction_families above expose only primitive string and aggregate
# operations (length, concatenation, substring, char access, equality,
# containment, and layout-driven aggregate pack/get/set/tag); every richer
# algorithm is provided by runtime libraries reached through call.import / trap.
#
# The v1 legacy_opcodes inventory still lists the compound STR_* opcodes
# (STR_TRIM, STR_TO_LOWER, STR_TO_UPPER, STR_STARTS_WITH, STR_ENDS_WITH,
# STR_SPLIT, STR_REPLACE) for executable v1 compatibility only; they are absent
# from the v2 families on purpose. This section records the algorithms that
# have been moved out of the ISA so schema tests can guard against them
# re-entering the portable instruction set.
runtime_library_algorithms:
  - {name: str_trim, category: trimming, primitives: [str_length, char_at, str_substring]}
  - {name: str_trim_left, category: trimming, primitives: [str_length, char_at, str_substring]}
  - {name: str_trim_right, category: trimming, primitives: [str_length, char_at, str_substring]}
  - {name: str_to_lower, category: case-conversion, primitives: [str_length, char_at, string_from_char, str_concat]}
  - {name: str_to_upper, category: case-conversion, primitives: [str_length, char_at, string_from_char, str_concat]}
  - {name: str_split, category: splitting, primitives: [str_length, char_at, str_substring, str_equals]}
  - {name: str_join, category: collection, primitives: [str_concat]}
  - {name: str_replace, category: replacement, primitives: [str_length, str_substring, str_contains, str_concat]}
  - {name: str_starts_with, category: matching, primitives: [str_length, str_substring, str_equals]}
  - {name: str_ends_with, category: matching, primitives: [str_length, str_substring, str_equals]}
  - {name: str_index_of, category: matching, primitives: [str_length, str_substring, str_equals]}
  - {name: format, category: formatting, primitives: [str_concat, int_to_string, float_to_string]}
  - {name: string_to_int, category: parsing, primitives: [str_length, char_at]}
  - {name: string_to_float, category: parsing, primitives: [str_length, char_at]}
