name: Qualified record projection repair
on:
  push:
    branches: [work/5.1-representation-joins-hosted-20261128]
    paths:
      - '.github/workflows/qualified-record-projection-hosted.yml'
      - 'scripts/ci_qualified_record_projection.py'
      - 'tests/test_ci_qualified_record_projection_observer.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  OLD_REVISION: e2ad13e3ee129b926a5cab9b15f22bf61c0ac5d8
  PRODUCT_REVISION: 7ffdb2069f192f1e2d3a3dcf378f256cbcaa62d8
  OBSERVER_REVISION: ${{ github.sha }}
  CC: cc
jobs:
  projection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Require an actual hosted worker
        run: test '${{ runner.environment }}' = github-hosted
      - name: Check out my observer
        uses: actions/checkout@v4
        with:
          path: observer
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci_qualified_record_projection.py
            /scripts/ci_original_qualification_policy.py
            /tests/test_ci_qualified_record_projection_observer.py
            /.github/workflows/qualified-record-projection-hosted.yml
      - name: Check out my unchanged old reference
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_REVISION }}
          path: old
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
      - name: Check out my current repair
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_REVISION }}
          path: product
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
      - name: Install my Linux dependencies
        if: runner.os == 'Linux'
        working-directory: product
        run: |
          ./scripts/ci-apt-install.sh build-essential pkg-config libssl-dev libffi-dev libsqlite3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Install my Darwin dependencies
        if: runner.os == 'macOS'
        working-directory: product
        run: |
          ./scripts/ci-brew-install.sh pkg-config openssl sqlite sdl2 sdl2_image sdl2_mixer sdl2_ttf utf8proc
      - name: Select my qualified Darwin compiler and SDK
        if: runner.os == 'macOS'
        working-directory: product
        run: python3 scripts/ci_select_capture_clang.py
      - name: Install my observer Python dependency
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user pyyaml \
            || python3 -m pip install --user --break-system-packages pyyaml
          python3 -c 'import yaml'
      - name: Check my observer admission before any product build
        run: |
          mkdir evidence
          python3 -m unittest discover -s observer/tests -p test_ci_qualified_record_projection_observer.py -v \
            > evidence/observer-controls.stdout 2> evidence/observer-controls.stderr
      - name: Execute my exact old and current controls
        run: |
          python3 observer/scripts/ci_qualified_record_projection.py --old old --product product \
            --output evidence/projection > evidence/controller.stdout 2> evidence/controller.stderr
      - name: Check my final source identities
        if: always()
        run: |
          git -C product diff --exit-code HEAD
          git -C old diff --exit-code HEAD
          git -C observer diff --exit-code HEAD
      - name: Retain my complete observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-record-projection-${{ matrix.os }}-${{ env.PRODUCT_REVISION }}-${{ github.sha }}
          path: |
            evidence/
            product/.test_output/retirement/capture-toolchain.json
            observer/scripts/ci_qualified_record_projection.py
            observer/scripts/ci_original_qualification_policy.py
            observer/tests/test_ci_qualified_record_projection_observer.py
            observer/.github/workflows/qualified-record-projection-hosted.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
