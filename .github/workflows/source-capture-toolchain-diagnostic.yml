name: Source capture selected-tool diagnostics
on:
  workflow_dispatch:
    inputs:
      linux_only:
        description: I observe Linux capture without starting the Apple qualification job.
        type: boolean
        default: false
      qualify_as_246:
        description: I qualify a private GNU as 2.46 candidate without changing product admission.
        type: boolean
        default: false
      diagnose_native_debug:
        description: I retain the four native debug failures in a private candidate, without qualifying admission.
        type: boolean
        default: false
      qualify_clang_2118:
        description: I qualify a private Ubuntu Clang 21.1.8 report candidate through original capture controls.
        type: boolean
        default: false
      qualify_response_grammar:
        description: I qualify actual selected-driver response grammar with original transport controls.
        type: boolean
        default: false
      qualify_clang_2118_complete:
        description: I observe the complete source/response corpus and cold capture with a private Clang21 candidate, preserving GNU admission.
        type: boolean
        default: false
      clang_2118_backend:
        description: I compare the system backend with already-supported GNU2.42 only inside private Clang qualification.
        type: choice
        options: [system, qualified-as242]
        default: system
  push:
    branches: [fix/5.1-platform-qualification, fix/5.1-capture-requalification]
    paths:
      - '.github/workflows/source-capture-toolchain-diagnostic.yml'
      - 'scripts/ci_source_capture_diagnostic.py'
      - 'scripts/ci_source_capture_linux.py'
      - 'src/module_builder.c'
      - 'tests/test_source_snapshots.py'
permissions:
  contents: read
jobs:
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retain selected Linux compiler and assembler evidence
        run: python3 scripts/ci_source_capture_diagnostic.py
      - name: Build the actual capture probe and helper
        run: |
          make -f Makefile.gnu -j2 obj/test_module_generation_probe bin/nano_as_capture.so > .test_output/source-capture-diagnostic/linux-probe-build.log 2>&1
      - name: Check diagnostic identity refusal and timeout evidence retention
        run: |
          python3 -m unittest -v tests.test_capture_qualification_modes > .test_output/source-capture-diagnostic/diagnostic-controls.log 2>&1
      - name: Observe a cold compiler support capture without changing admission
        run: python3 scripts/ci_source_capture_linux.py
      - name: Qualify the isolated GNU assembler 2.46 candidate
        if: inputs.qualify_as_246
        timeout-minutes: 25
        run: python3 scripts/ci_qualify_as246.py
      - name: Diagnose native debug provenance in an isolated candidate
        if: inputs.diagnose_native_debug && !inputs.qualify_as_246 && !inputs.qualify_clang_2118 && !inputs.qualify_response_grammar
        timeout-minutes: 25
        run: python3 scripts/ci_qualify_as246.py --native-debug-only
      - name: Qualify the isolated Ubuntu Clang 21.1.8 report candidate
        if: inputs.qualify_clang_2118 && !inputs.qualify_as_246 && !inputs.qualify_response_grammar
        timeout-minutes: 25
        run: python3 scripts/ci_qualify_as246.py --clang-2118-only
      - name: Qualify selected-driver response grammar in an isolated assembler candidate
        if: inputs.qualify_response_grammar && !inputs.qualify_as_246
        timeout-minutes: 25
        run: python3 scripts/ci_qualify_as246.py --response-only
      - name: Observe complete private Clang 21 capture without changing GNU admission
        if: inputs.qualify_clang_2118_complete && !inputs.qualify_as_246 && !inputs.diagnose_native_debug && !inputs.qualify_clang_2118 && !inputs.qualify_response_grammar
        env:
          QUALIFICATION_BACKEND: ${{ inputs.clang_2118_backend }}
        timeout-minutes: 25
        shell: bash
        run: |
          # I select a driver only for this explicit private qualification step.
          # The ordinary cold/default-tool and user-guide jobs keep their tools.
          if [[ "$QUALIFICATION_BACKEND" == qualified-as242 ]]; then
            python3 scripts/ci_build_qualified_as242.py
            export NANO_QUALIFIED_AS242_DIRECTORY="$PWD/.test_output/source-capture-diagnostic/qualified-as242"
            export COMPILER_PATH="$NANO_QUALIFIED_AS242_DIRECTORY/bin"
          fi
          qualification_tools="$PWD/.test_output/source-capture-diagnostic/clang-qualification-tools"
          mkdir "$qualification_tools"
          selected_clang="$(command -v clang)"
          ln -s "$selected_clang" "$qualification_tools/cc"
          ln -s "$selected_clang" "$qualification_tools/clang"
          PATH="$qualification_tools:$PATH" python3 scripts/ci_qualify_as246.py --clang-2118-complete
      - name: Upload Linux capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-capture-tools-linux
          path: .test_output/source-capture-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  selected-tools:
    if: ${{ !inputs.linux_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select the existing retirement Homebrew compiler
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          if [[ ! -x /opt/homebrew/opt/llvm/bin/clang ]]; then
            ./scripts/ci-brew-install.sh llvm
          fi
      - name: Retain current selected compiler and assembler evidence
        run: python3 scripts/ci_source_capture_diagnostic.py
      - name: Select only an installed Xcode with passing backend probes
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path('.test_output/source-capture-diagnostic').resolve()
          commands = {r['label']: r for r in json.loads((root/'commands.json').read_text())}
          candidates = []
          for file in root.glob('*/compiler.json'):
              data = json.loads(file.read_text())
              if not data.get('developer_dir'):
                  continue
              number = file.parent.name
              required = [number+'-'+name for name in ('external-assemble', 'external-fresh-shared', 'debug-expand', 'debug-replay')]
              data['required_probes'] = {name: commands.get(name, {}).get('returncode') for name in required}
              data['passed'] = all(data['required_probes'][name] == 0 for name in required)
              candidates.append(data)
          passing = [c for c in candidates if c['passed']]
          passing.sort(key=lambda c: tuple(map(int, re.findall(r'\d+', c['developer_dir']))))
          selected = passing[-1] if passing else None
          (root/'capture-selection.json').write_text(json.dumps({'candidates': candidates, 'selected': selected}, indent=2)+'\n')
          if selected is None:
              raise SystemExit('I found no installed Xcode passing actual external assembly and debug-text replay; capture remains unqualified.')
          tools = root/'selected-tools'; tools.mkdir()
          import hashlib, sys
          wrapper = '#!'+sys.executable+'\nimport os,sys\ncompiler='+repr(selected['resolved'])+'\nos.execv(compiler, [compiler, *sys.argv[1:]])\n'
          wrapper_hashes = {}
          for name in ('cc', 'clang'):
              path = tools/name
              path.write_text(wrapper); path.chmod(0o700)
              wrapper_hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root/'capture-wrapper-hashes.json').write_text(json.dumps(wrapper_hashes, indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR='+selected['developer_dir']+'\n')
              f.write('SDKROOT='+selected['sdk_root']+'\n')
          with open(os.environ['GITHUB_PATH'], 'a') as f:
              f.write(str(tools)+'\n')
          PY
      - name: Retain actual capture tool selection
        run: |
          { command -v cc; cc --version; command -v clang; clang --version; xcrun --find as; } > .test_output/source-capture-diagnostic/capture-selected-tools.log 2>&1
      - name: Build only the production capture probe
        shell: bash
        run: |
          flags="-Wall -Wextra -Werror -std=c99 -O2 -g -Isrc -D_GNU_SOURCE"
          links="-lm -lcrypto"
          if [[ "$RUNNER_OS" == macOS ]]; then
            prefix="$(brew --prefix openssl@3)"
            test -f "$prefix/include/openssl/sha.h"
            flags="$flags -I$prefix/include"
            links="$links -L$prefix/lib"
          fi
          make -f Makefile.gnu -j2 obj/test_module_generation_probe CC=cc CFLAGS="$flags" LDFLAGS="$links" > .test_output/source-capture-diagnostic/probe-build.log 2>&1
      - name: Qualify exact report parsing and real integrated capture
        timeout-minutes: 15
        run: |
          python3 -m unittest -v \
            tests.test_source_snapshots.SourceSnapshots.test_selected_clang_assembler_report_boundaries \
            tests.test_source_snapshots.SourceSnapshots.test_integrated_native_unit_post_capture_reads \
            tests.test_source_snapshots.SourceSnapshots.test_integrated_native_unit_failure_recovery \
            tests.test_source_snapshots.SourceSnapshots.test_integrated_units_preserve_c_assembler_search \
            tests.test_source_snapshots.SourceSnapshots.test_integrated_native_unit_debug_identity \
            tests.test_source_snapshots.SourceSnapshots.test_integrated_instruction_and_location_provenance \
            tests.test_source_snapshots.SourceSnapshots.test_native_unit_post_capture_reads \
            tests.test_source_snapshots.SourceSnapshots.test_apple_native_unit_capture_failure_recovery \
            > .test_output/source-capture-diagnostic/integrated-capture.log 2>&1
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-capture-tools-${{ matrix.os }}
          path: .test_output/source-capture-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
