name: User Guide (GitHub Pages)

on:
  pull_request:
    paths:
      - "userguide/**"
      - "docs/STDLIB.md"
      - "docs/WASM_MODULE_AUDIT.md"
      - "examples/**"
      - "modules/**"
      - "src/builtins_registry.c"
      - "src/main.c"
      - "scripts/build_userguide.py"
      - "scripts/userguide_snippets_check.nano"
      - "Makefile.gnu"
      - ".github/workflows/userguide_pages.yml"
  push:
    branches: [ main ]
    paths:
      - "userguide/**"
      - "docs/STDLIB.md"
      - "docs/WASM_MODULE_AUDIT.md"
      - "examples/**"
      - "modules/**"
      - "src/builtins_registry.c"
      - "src/main.c"
      - "scripts/build_userguide.py"
      - "scripts/userguide_snippets_check.nano"
      - "Makefile.gnu"
      - ".github/workflows/userguide_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "userguide-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache module objects
        uses: actions/cache@v4
        with:
          path: |
            obj/nano_modules
            modules/*/.build
          key: nano-modules-${{ hashFiles('modules/**/*.nano', 'stdlib/**/*.nano', 'src_nano/**/*.nano', 'modules/**/*.c') }}
          restore-keys: |
            nano-modules-

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate user guide snippets
        run: make userguide-check

      - name: Build user guide HTML
        run: make userguide-html
        env:
          USERGUIDE_TIMEOUT: 2400

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/userguide/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
