name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NANO_VERIFY_CORPUS_LOG_ROOT: .test_output/verifier-corpus

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.arch || 'x64' }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 75
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
            allow_failure: true
          - os: macos-14
            arch: arm64
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show platform info
        run: |
          echo "OS: ${{ runner.os }}"
          echo "Architecture: ${{ matrix.arch || 'default' }}"
          uname -a || systeminfo | findstr /B /C:"OS Name" /C:"OS Version" /C:"System Type"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./scripts/ci-apt-install.sh \
            build-essential \
            valgrind \
            pkg-config \
            libssl-dev libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libncurses-dev \
            libreadline-dev \
            libevent-dev libuv1-dev libbullet-dev \
            libglfw3-dev libglew-dev freeglut3-dev \
            libutf8proc-dev \
            gforth

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          ./scripts/ci-brew-install.sh \
            gcc \
            llvm \
            pkg-config \
            openssl \
            sdl2 \
            sdl2_image \
            sdl2_mixer \
            sdl2_ttf \
            utf8proc \
            glfw glew freeglut \
            readline libevent libuv bullet \
            gforth

      - name: Select native sanitizer tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          llvm_prefix="$(brew --prefix llvm)"
          "$llvm_prefix/bin/clang" --version
          "$llvm_prefix/bin/opt" --version
          {
            printf 'NANO_NATIVE_TEST_CC=%s/bin/clang\n' "$llvm_prefix"
            printf 'NANOLANG_GUARD_SAN_CC=%s/bin/clang\n' "$llvm_prefix"
            printf 'NMS_RUNTIME_CLANG=%s/bin/clang\n' "$llvm_prefix"
            printf 'NMS_RUNTIME_OPT=%s/bin/opt\n' "$llvm_prefix"
          } >> "$GITHUB_ENV"

      - name: Install Python dependencies
        shell: bash
        run: |
          # Already satisfied on some images; skip rather than fight the
          # environment. Where pip refuses under PEP 668
          # (externally-managed-environment, seen on the arm64 runners), retry
          # with --break-system-packages: this is a throwaway CI environment,
          # not a system Python worth protecting.
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
          python3 -c 'import yaml'

      - name: Check dependencies
        shell: bash
        run: make check-deps

      - name: Build - Stage 1 (C Reference Compiler)
        run: make stage1

      - name: Build - Stage 2 (Self-Hosted Components)
        run: make stage2

      - name: Build - Stage 3 (Bootstrap Validation)
        run: make stage3

      - name: Run test suite with JUnit XML output
        # The Memory Sanitizers gate owns the complete resolved Make inventory.
        # This platform matrix retains native build and program smoke evidence.
        run: make test-junit
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Nanolang Test Suite
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Run negative tests
        env:
          NANOLANG_COMPILER: ./bin/nanoc_c
        run: bash tests/run_negative_tests.sh

      - name: Validate user guide snippets
        run: make userguide-check

      - name: Retain verifier-corpus diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-corpus-${{ matrix.os }}-${{ matrix.arch }}
          path: .test_output/verifier-corpus/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Show error logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Showing first failed test logs ==="
          for log in .test_output/*.compile.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
              echo ""
            fi
          done | head -200

      - name: Verify binaries exist
        shell: bash
        run: |
          test -f ./bin/nanoc || exit 1
          echo "✓ Compiler binary built successfully"

      - name: Test basic examples
        shell: bash
        run: |
          ./bin/nanoc examples/language/nl_hello.nano -o hello_test
          ./hello_test
          ./bin/nanoc examples/language/nl_factorial.nano -o factorial_test
          ./factorial_test
          rm -f hello_test factorial_test

      # Valgrind checks disabled - small leaks acceptable for short-lived compiler
      # - name: Check for memory leaks (Linux only)
      #   if: runner.os == 'Linux'
      #   run: make valgrind || true

  examples:
    name: Strict examples (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: bash
        run: |
          # Already satisfied on some images; skip rather than fight the
          # environment. Where pip refuses under PEP 668
          # (externally-managed-environment, seen on the arm64 runners), retry
          # with --break-system-packages: this is a throwaway CI environment,
          # not a system Python worth protecting.
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
          python3 -c 'import yaml'

      - name: Install example dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./scripts/ci-apt-install.sh \
            build-essential \
            pkg-config \
            libssl-dev libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libncurses-dev \
            libreadline-dev \
            libevent-dev \
            libuv1-dev \
            libbullet-dev \
            libglfw3-dev \
            libglew-dev \
            freeglut3-dev

      - name: Install example dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          ./scripts/ci-brew-install.sh \
            gcc \
            pkg-config \
            openssl \
            sdl2 \
            sdl2_image \
            sdl2_mixer \
            sdl2_ttf \
            readline \
            libevent \
            libuv \
            bullet \
            glfw \
            glew \
            freeglut

      - name: Build C reference compiler
        run: make stage1

      - name: Run escaped-example regressions
        timeout-minutes: 2
        run: make test-examples-regressions

      - name: Build every available example strictly
        timeout-minutes: 40
        env:
          NANO_SHADOW_TIMEOUT_SECONDS: "60"
        run: make examples EXAMPLES_TIMEOUT=2400

  docs:
    name: Docs (link check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Assert performance-monitoring docs
        run: bash tests/test_performance_monitoring_docs.sh

      - name: Check stdlib documentation coverage
        run: bash tests/check_stdlib_docs.sh

      - name: Test and build user guide
        run: |
          python3 -m unittest tests/test_build_userguide.py
          make userguide-html

      - name: Check release dependency metadata
        run: |
          python3 -m unittest tests/test_generate_root_package_json.py
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          make package-json VERSION="$VERSION"
          git diff --exit-code -- package.json

  api-docs:
    name: API Docs (nanodoc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate API documentation
        run: |
          mkdir -p docs/api
          node tools/nanodoc.mjs --output docs/api \
            $(find std -name '*.nano' | sort) \
            $(find examples/language -name '*.nano' | sort)

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 30

  sanitizer-plan:
    name: Sanitizer partition inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install workflow validation dependency
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
          python3 -c 'import yaml'
      - name: Check complete partition and aggregate refusals
        run: python3 -m unittest -v tests.test_ci_sanitizer_partitions
      - id: plan
        run: python3 scripts/ci_sanitizer_partitions.py plan --output "$RUNNER_TEMP/sanitizer-plan" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
          retention-days: 7

  sanitizer-base:
    name: Sanitizer instrumented base
    needs: sanitizer-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - name: Set retained report paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-base-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-base" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Verify exact head and inventory
        run: python3 scripts/ci_sanitizer_partitions.py verify --manifest "$PLAN" --worker negative --output "$REPORT"
      - name: Build instrumented C-reference and component stages
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker negative --output "$REPORT" --phase sanitize 2>&1 | tee "$REPORT/sanitize.log"
      - name: Verify base instrumentation
        run: python3 scripts/ci_sanitizer_partitions.py instrumentation --manifest "$PLAN" --worker negative --output "$REPORT"
      - name: Publish exact base bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage base --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-base
          path: ${{ runner.temp }}/sanitizer-base/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-stage1:
    name: Sanitizer native Stage 1
    needs: [sanitizer-plan, sanitizer-base]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-base
          path: ${{ runner.temp }}/sanitizer-base
      - name: Set retained paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-stage1-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-stage1" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Restore exact instrumented base
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage base --archive "$RUNNER_TEMP/sanitizer-base/base.tar.gz" --metadata "$RUNNER_TEMP/sanitizer-base/base.json" --output "$REPORT"
      - name: Build instrumented native Stage 1
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap1 2>&1 | tee "$REPORT/bootstrap1.log"
      - name: Build ordinary Stage 1 producer
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap1-driver 2>&1 | tee "$REPORT/bootstrap1-driver.log"
      - name: Build instrumented Stage 2 companion providers
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap1-companions 2>&1 | tee "$REPORT/bootstrap1-companions.log"
      - name: Publish exact Stage 1 bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage stage1 --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-stage1
          path: ${{ runner.temp }}/sanitizer-stage1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-stage2-nvm:
    name: Sanitizer native Stage 2 NanoISA
    needs: [sanitizer-plan, sanitizer-stage1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-stage1
          path: ${{ runner.temp }}/sanitizer-stage1
      - name: Set retained paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-stage2-nvm-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-stage2-nvm" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Restore exact instrumented Stage 1
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage stage1 --archive "$RUNNER_TEMP/sanitizer-stage1/stage1.tar.gz" --metadata "$RUNNER_TEMP/sanitizer-stage1/stage1.json" --output "$REPORT"
      - name: Build verified Stage 2 NanoISA
        run: |
          mkdir -p build/sanitizer-stage2
          python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap2-nvm 2>&1 | tee "$REPORT/bootstrap2-nvm.log"
      - name: Publish exact Stage 2 NanoISA bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage stage2-nvm --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-stage2-nvm
          path: ${{ runner.temp }}/sanitizer-stage2-nvm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-stage2-c:
    name: Sanitizer native Stage 2 C
    needs: [sanitizer-plan, sanitizer-stage2-nvm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-stage2-nvm
          path: ${{ runner.temp }}/sanitizer-stage2-nvm
      - name: Set retained paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-stage2-c-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-stage2-c" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Restore exact Stage 2 NanoISA
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage stage2-nvm --archive "$RUNNER_TEMP/sanitizer-stage2-nvm/stage2-nvm.tar.gz" --metadata "$RUNNER_TEMP/sanitizer-stage2-nvm/stage2-nvm.json" --output "$REPORT"
      - name: Translate verified Stage 2 NanoISA to C
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap2-c 2>&1 | tee "$REPORT/bootstrap2-c.log"
      - name: Publish exact Stage 2 C bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage stage2-c --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-stage2-c
          path: ${{ runner.temp }}/sanitizer-stage2-c/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-bootstrap:
    name: Sanitizer native Stage 2 and verification
    needs: [sanitizer-plan, sanitizer-stage2-object]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-stage2-object
          path: ${{ runner.temp }}/sanitizer-stage2-object
      - name: Set retained paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-bootstrap-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-bootstrap" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Restore exact Stage 2 object
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage stage2-object --archive "$RUNNER_TEMP/sanitizer-stage2-object/stage2-object.tar.gz" --metadata "$RUNNER_TEMP/sanitizer-stage2-object/stage2-object.json" --output "$REPORT"
      - name: Compile instrumented native Stage 2
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap2-native 2>&1 | tee "$REPORT/bootstrap2-native.log"
      - name: Smoke instrumented native Stage 2
        timeout-minutes: 30
        run: |
          python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap2-smoke 2>&1 | tee "$REPORT/bootstrap2-smoke.log"
          build/sanitizer-stage2/hello >/dev/null
      - name: Finalize instrumented bootstrap boundary
        timeout-minutes: 60
        run: |
          # The smoke may refresh module-cache prerequisites after the restored
          # Stage 1 stamp. Both products were hash-verified by restore above.
          touch .bootstrap1.built .bootstrap2.built
          set -o pipefail
          python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap3 2>&1 | tee "$REPORT/bootstrap3.log" &
          bootstrap_pid=$!
          trap 'kill "$bootstrap_pid" 2>/dev/null || true' EXIT
          while kill -0 "$bootstrap_pid" 2>/dev/null; do
            sleep 60
            if kill -0 "$bootstrap_pid" 2>/dev/null; then
              echo "I am still finalizing the instrumented bootstrap boundary."
            fi
          done
          wait "$bootstrap_pid"
          trap - EXIT
      - name: Publish exact Stage 2 bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage stage2 --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-stage2
          path: ${{ runner.temp }}/sanitizer-bootstrap/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-stage2-object:
    name: Sanitizer native Stage 2 object
    needs: [sanitizer-plan, sanitizer-stage2-c]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-stage2-c
          path: ${{ runner.temp }}/sanitizer-stage2-c
      - name: Set retained paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-stage2-object-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-stage2-object" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Restore exact Stage 2 C
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage stage2-c --archive "$RUNNER_TEMP/sanitizer-stage2-c/stage2-c.tar.gz" --metadata "$RUNNER_TEMP/sanitizer-stage2-c/stage2-c.json" --output "$REPORT"
      - name: Compile instrumented Stage 2 object
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker scalar --output "$REPORT" --phase bootstrap2-object 2>&1 | tee "$REPORT/bootstrap2-object.log"
      - name: Publish exact Stage 2 object bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage stage2-object --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-stage2-object
          path: ${{ runner.temp }}/sanitizer-stage2-object/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-providers:
    name: Sanitizer source-emitter providers
    needs: [sanitizer-plan, sanitizer-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-stage2
          path: ${{ runner.temp }}/sanitizer-stage2
      - name: Set retained paths
        run: |
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/sanitizer-providers-report" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-bootstrap" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang llvm lld pkg-config libssl-dev libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libutf8proc-dev
      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
      - name: Restore exact instrumented Stage 2
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage stage2 --archive "$RUNNER_TEMP/sanitizer-stage2/stage2.tar.gz" --metadata "$RUNNER_TEMP/sanitizer-stage2/stage2.json" --output "$REPORT"
      - name: Build source-emitter providers
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker source --output "$REPORT" --phase providers 2>&1 | tee "$REPORT/providers.log"
      - name: Verify native compiler instrumentation
        run: python3 scripts/ci_sanitizer_partitions.py instrumentation --manifest "$PLAN" --worker scalar --output "$REPORT"
      - name: Publish exact bootstrap bundle
        run: python3 scripts/ci_sanitizer_partitions.py bundle --manifest "$PLAN" --stage bootstrap --output "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-bootstrap
          path: ${{ runner.temp }}/sanitizer-bootstrap/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sanitizer-workers:
    name: Sanitizer (${{ matrix.id }})
    needs: [sanitizer-plan, sanitizer-providers]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.id == 'source' && 75) || (matrix.id == 'scalar' && 45) || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.sanitizer-plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=0
      NANO_SHADOW_TIMEOUT_SECONDS: "300"
    steps:
      - name: Set retained report paths
        run: |
          echo "REPORT=$RUNNER_TEMP/sanitizer-${{ matrix.id }}" >> "$GITHUB_ENV"
          echo "PLAN=$RUNNER_TEMP/sanitizer-plan/plan.json" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/sanitizer-bootstrap" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-bootstrap
          path: ${{ runner.temp }}/sanitizer-bootstrap
      - name: Install Python dependencies
        shell: bash
        run: |
          # Already satisfied on some images; skip rather than fight the
          # environment. Where pip refuses under PEP 668
          # (externally-managed-environment, seen on the arm64 runners), retry
          # with --break-system-packages: this is a throwaway CI environment,
          # not a system Python worth protecting.
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
          python3 -c 'import yaml'

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          ./scripts/ci-apt-install.sh \
            build-essential clang llvm lld \
            pkg-config \
            libssl-dev libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libutf8proc-dev

      - name: Select matching distribution LLVM tools
        run: |
          LLVM_BIN=$(/usr/bin/llvm-config --bindir)
          for tool in clang opt llvm-as llvm-dis lli llc llvm-nm wasm-ld; do
            test -x "$LLVM_BIN/$tool"
          done
          echo "$LLVM_BIN" >> "$GITHUB_PATH"

      - name: Verify exact head and complete unit inventory
        id: verify
        run: python3 scripts/ci_sanitizer_partitions.py verify --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT"
      - name: Restore exact instrumented bootstrap
        id: restore
        run: python3 scripts/ci_sanitizer_partitions.py restore --manifest "$PLAN" --stage bootstrap --archive "$BUNDLE/bootstrap.tar.gz" --metadata "$BUNDLE/bootstrap.json" --output "$REPORT"
      - name: Inventory original source and tools
        id: before
        run: python3 scripts/ci_sanitizer_partitions.py snapshot --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT" --phase before
      - name: Verify actual compiler sanitizer instrumentation
        id: instrumentation
        run: python3 scripts/ci_sanitizer_partitions.py instrumentation --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT"
      - name: Inventory actual providers before tests
        id: prepared
        run: python3 scripts/ci_sanitizer_partitions.py snapshot --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT" --phase prepared
      - name: Run complete assigned sanitizer tests
        id: tests
        timeout-minutes: ${{ (matrix.id == 'source' && 45) || (matrix.id == 'scalar' && 35) || 20 }}
        run: python3 scripts/ci_sanitizer_partitions.py command --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT" --phase tests 2>&1 | tee "$REPORT/tests.log"
      - name: Inventory source tools and surviving products after terminal
        id: after
        if: always()
        run: python3 scripts/ci_sanitizer_partitions.py snapshot --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT" --phase after
      - name: Record exact worker outcome
        if: always()
        env:
          CI_SANITIZER_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/ci_sanitizer_partitions.py result --manifest "$PLAN" --worker '${{ matrix.id }}' --output "$REPORT"
      - name: Retain raw worker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-result-${{ matrix.id }}
          path: |
            ${{ env.REPORT }}
            .test_output/verifier-corpus/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual surviving providers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-providers-${{ matrix.id }}
          path: |
            bin/
            obj/
            obj-runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  sanitizers:
    name: Memory Sanitizers
    needs: [sanitizer-plan, sanitizer-base, sanitizer-stage1, sanitizer-stage2-nvm, sanitizer-stage2-c, sanitizer-stage2-object, sanitizer-bootstrap, sanitizer-providers, sanitizer-workers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-plan
          path: ${{ runner.temp }}/sanitizer-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: sanitizer-result-*
          path: ${{ runner.temp }}/sanitizer-results
      - name: Require every exact worker and negative-suite terminal
        env:
          PLAN_RESULT: ${{ needs.sanitizer-plan.result }}
          BASE_RESULT: ${{ needs.sanitizer-base.result }}
          STAGE1_RESULT: ${{ needs.sanitizer-stage1.result }}
          STAGE2_NVM_RESULT: ${{ needs.sanitizer-stage2-nvm.result }}
          STAGE2_C_RESULT: ${{ needs.sanitizer-stage2-c.result }}
          STAGE2_OBJECT_RESULT: ${{ needs.sanitizer-stage2-object.result }}
          BOOTSTRAP_RESULT: ${{ needs.sanitizer-bootstrap.result }}
          PROVIDERS_RESULT: ${{ needs.sanitizer-providers.result }}
          WORKER_RESULT: ${{ needs.sanitizer-workers.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$BASE_RESULT" = success
          test "$STAGE1_RESULT" = success
          test "$STAGE2_NVM_RESULT" = success
          test "$STAGE2_C_RESULT" = success
          test "$STAGE2_OBJECT_RESULT" = success
          test "$BOOTSTRAP_RESULT" = success
          test "$PROVIDERS_RESULT" = success
          test "$WORKER_RESULT" = success
          python3 scripts/ci_sanitizer_partitions.py aggregate --manifest "$RUNNER_TEMP/sanitizer-plan/plan.json" --results "$RUNNER_TEMP/sanitizer-results" --output "$RUNNER_TEMP/sanitizer-aggregate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-aggregate
          path: ${{ runner.temp }}/sanitizer-aggregate
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      COVERAGE_THRESHOLD: "25.0"
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: bash
        run: |
          # Already satisfied on some images; skip rather than fight the
          # environment. Where pip refuses under PEP 668
          # (externally-managed-environment, seen on the arm64 runners), retry
          # with --break-system-packages: this is a throwaway CI environment,
          # not a system Python worth protecting.
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m pip install --user --upgrade pyyaml \
            || python3 -m pip install --user --break-system-packages --upgrade pyyaml
          python3 -c 'import yaml'

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          ./scripts/ci-apt-install.sh \
            build-essential \
            lcov \
            bc \
            pkg-config \
            libssl-dev libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libutf8proc-dev \
            libncurses-dev libreadline-dev \
            libevent-dev libuv1-dev libbullet-dev \
            libglfw3-dev libglew-dev freeglut3-dev \
            gforth

      - name: Build with coverage
        run: make coverage

      - name: Complete 3-stage bootstrap with coverage
        run: make build CFLAGS="-Wall -Wextra -Werror -std=c99 -g -Isrc -D_GNU_SOURCE -fprofile-arcs -ftest-coverage"

      - name: Run tests
        env:
          NANO_SHADOW_TIMEOUT_SECONDS: "60"
          NANO_VM_EXAMPLE_SHADOW_TIMEOUT_SECONDS: "60"
          NANOLANG_COMPILER: ./bin/nanoc_c
        timeout-minutes: 20
        run: ./tests/run_all_tests.sh

      - name: Run negative tests
        env:
          NANOLANG_COMPILER: ./bin/nanoc_c
        run: bash tests/run_negative_tests.sh

      - name: Retain verifier-corpus diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-corpus-coverage
          path: .test_output/verifier-corpus/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Show error logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Showing first failed test logs ==="
          for log in .test_output/*.compile.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
              echo ""
            fi
          done | head -200

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '*/cJSON.c' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: Generate HTML coverage report
        run: |
          genhtml coverage.info --output-directory coverage-html

      - name: Calculate coverage percentage
        id: coverage
        run: |
          # Extract overall line coverage percentage
          COVERAGE=$(lcov --summary coverage.info 2>&1 | grep "lines" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | sed 's/%//')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Enforce coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          THRESHOLD=${COVERAGE_THRESHOLD:-70.0}
          echo "Current coverage: $COVERAGE%"
          echo "Required threshold: $THRESHOLD%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
            echo "Please add tests to improve coverage."
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
          fi


      - name: Upload coverage report to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.info
            coverage-html/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const body = `## Code Coverage Report\n\n📊 **Coverage: ${coverage}%**\n\n✅ Coverage threshold (80%) met.\n\n[View detailed report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            const [repoOwner, repoName] = process.env.GITHUB_REPOSITORY.split('/');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: repoOwner,
              repo: repoName,
              body: body
            });

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison

      - name: Install dependencies
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential bc pkg-config libffi-dev

      - name: Download baseline benchmark
        id: baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: performance-baseline
          path: .benchmark_baseline

      - name: Run performance benchmarks
        run: |
          ./scripts/benchmark.sh
          cp .benchmark_results/benchmark_*.json .benchmark_results/current.json

      - name: Compare with baseline
        id: compare
        if: steps.baseline.outcome == 'success'
        run: |
          BASELINE=.benchmark_baseline/baseline.json
          CURRENT=.benchmark_results/current.json
          
          if [ ! -f "$BASELINE" ]; then
            echo "No baseline found, skipping comparison"
            echo "regression=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Extract key metrics
          BASELINE_BUILD=$(grep "total_build_ms" "$BASELINE" | grep -oE '[0-9]+')
          CURRENT_BUILD=$(grep "total_build_ms" "$CURRENT" | grep -oE '[0-9]+')
          
          BASELINE_TEST=$(grep "test_suite_ms" "$BASELINE" | grep -oE '[0-9]+')
          CURRENT_TEST=$(grep "test_suite_ms" "$CURRENT" | grep -oE '[0-9]+')
          
          BASELINE_COMPILE=$(grep "self_hosting_compile_ms" "$BASELINE" | grep -oE '[0-9]+')
          CURRENT_COMPILE=$(grep "self_hosting_compile_ms" "$CURRENT" | grep -oE '[0-9]+')
          
          # Calculate percentage changes
          BUILD_PCT=$(echo "scale=2; ($CURRENT_BUILD - $BASELINE_BUILD) * 100 / $BASELINE_BUILD" | bc)
          TEST_PCT=$(echo "scale=2; ($CURRENT_TEST - $BASELINE_TEST) * 100 / $BASELINE_TEST" | bc)
          COMPILE_PCT=$(echo "scale=2; ($CURRENT_COMPILE - $BASELINE_COMPILE) * 100 / $BASELINE_COMPILE" | bc)
          
          echo "build_change=$BUILD_PCT" >> $GITHUB_OUTPUT
          echo "test_change=$TEST_PCT" >> $GITHUB_OUTPUT
          echo "compile_change=$COMPILE_PCT" >> $GITHUB_OUTPUT
          
          # Check for regressions (>20% slower)
          REGRESSION=false
          if (( $(echo "$BUILD_PCT > 20" | bc -l) )); then
            echo "⚠️  Build time regression: +${BUILD_PCT}% (${BASELINE_BUILD}ms → ${CURRENT_BUILD}ms)"
            REGRESSION=true
          fi
          if (( $(echo "$TEST_PCT > 20" | bc -l) )); then
            echo "⚠️  Test time regression: +${TEST_PCT}% (${BASELINE_TEST}ms → ${CURRENT_TEST}ms)"
            REGRESSION=true
          fi
          if (( $(echo "$COMPILE_PCT > 20" | bc -l) )); then
            echo "⚠️  Compile time regression: +${COMPILE_PCT}% (${BASELINE_COMPILE}ms → ${CURRENT_COMPILE}ms)"
            REGRESSION=true
          fi
          
          echo "regression=$REGRESSION" >> $GITHUB_OUTPUT
          
          # Create comparison report
          cat > .benchmark_results/comparison.md << EOF
          ## Performance Comparison
          
          | Metric | Baseline | Current | Change |
          |--------|----------|---------|--------|
          | Build Time | ${BASELINE_BUILD}ms | ${CURRENT_BUILD}ms | ${BUILD_PCT}% |
          | Test Suite | ${BASELINE_TEST}ms | ${CURRENT_TEST}ms | ${TEST_PCT}% |
          | Self-Host Compile | ${BASELINE_COMPILE}ms | ${CURRENT_COMPILE}ms | ${COMPILE_PCT}% |
          EOF

      - name: Fail on regression
        if: steps.compare.outputs.regression == 'true'
        run: |
          echo "❌ Performance regression detected (>20% slower)"
          echo "See comparison report in artifacts for details"
          cat .benchmark_results/comparison.md
          exit 1

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: .benchmark_results/

      - name: Update performance baseline (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: .benchmark_results/current.json

      - name: Comment performance on PR
        if: github.event_name == 'pull_request' && steps.compare.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const buildChange = '${{ steps.compare.outputs.build_change }}';
            const testChange = '${{ steps.compare.outputs.test_change }}';
            const compileChange = '${{ steps.compare.outputs.compile_change }}';
            
            let emoji = '✅';
            if (parseFloat(buildChange) > 20 || parseFloat(testChange) > 20 || parseFloat(compileChange) > 20) {
              emoji = '⚠️';
            } else if (parseFloat(buildChange) < -10 || parseFloat(testChange) < -10 || parseFloat(compileChange) < -10) {
              emoji = '🚀';
            }
            
            const body = `## ${emoji} Performance Report\n\n| Metric | Change |\n|--------|--------|\n| Build Time | ${buildChange}% |\n| Test Suite | ${testChange}% |\n| Self-Host Compile | ${compileChange}% |\n\n[View detailed benchmarks in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            const [perfOwner, perfRepo] = process.env.GITHUB_REPOSITORY.split('/');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: perfOwner,
              repo: perfRepo,
              body: body
            });

  concurrency:
    name: Concurrency (clang + libdispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          ./scripts/ci-apt-install.sh \
            clang \
            libblocksruntime-dev libffi-dev \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev
          # libdispatch-dev was removed from Ubuntu 24.04; install if available
          CI_APT_ATTEMPTS=1 CI_APT_TIMEOUT_SECS=60 \
            ./scripts/ci-apt-install.sh libdispatch-dev || true

      - name: Build stage 1 with clang
        run: make stage1 CC=clang

      - name: Build stage 2 (self-hosted) with clang
        run: make stage2 CC=clang

      - name: Compile nl_global_counter example
        run: |
          bin/nanoc examples/language/nl_global_counter.nano -o /tmp/nl_global_counter \
            CC=clang LDFLAGS="-ldispatch -lBlocksRuntime" || \
          CC=clang bin/nanoc examples/language/nl_global_counter.nano -o /tmp/nl_global_counter

      - name: Run nl_global_counter example
        run: /tmp/nl_global_counter

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-tidy
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential clang-tidy libffi-dev

      - name: Run clang-tidy
        run: |
          clang-tidy src/*.c -- -Isrc || true

  # ---------------------------------------------------------------------------
  # Benchmark gate — runs @bench / bench_* functions; fails on error or 0 ns/op
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark measurement check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python + deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clang / build deps
        timeout-minutes: 10
        run: ./scripts/ci-apt-install.sh build-essential pkg-config libssl-dev libffi-dev

      - name: Build nanoc
        run: make nanoc

      - name: Run benchmarks
        run: |
          ./bin/nanoc examples/bench_sample.nano --bench --bench-n 20 --bench-json bench-results.json
          python3 - <<'PY'
          import json
          text = open("bench-results.json").read().strip()
          if not text:
              raise SystemExit("empty bench-results.json")
          rows = []
          for line in text.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.startswith("["):
                  rows = json.loads(text)
                  break
              rows.append(json.loads(line))
          if len(rows) < 2:
              raise SystemExit(f"expected at least two benchmarks, got {len(rows)}")
          for row in rows:
              mean = float(row.get("mean_ns") or 0)
              ops = float(row.get("ops_per_sec") or 0)
              if mean <= 0 or ops <= 0:
                  raise SystemExit(f"zero measurement: {row}")
              print(f"{row.get('name')}: {mean:.3f} ns/op {ops:.1f} ops/s")
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: error
