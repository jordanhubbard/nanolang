name: Formal Proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: NanoCore proof gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Test assumption-report rejection
        run: python3 tests/test_proof_gate.py
      - name: Compile, audit assumptions, and independently check proofs
        run: bash scripts/check_proofs_container.sh
