name: Formal Proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: NanoCore proof gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test assumption-report rejection
        run: python3 tests/test_proof_gate.py
      - name: Compile, audit assumptions, and independently check proofs
        run: bash scripts/check_proofs_container.sh
