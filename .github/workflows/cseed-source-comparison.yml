name: Diagnostic alternating C-seed source creation

on:
  push:
    branches: [fix/5.1-stage-source-contracts]
    paths:
      - '.github/workflows/cseed-source-comparison.yml'
      - 'scripts/compare_cseed_source_creation.py'
  workflow_dispatch:
    inputs:
      baseline:
        description: I require the complete baseline commit SHA.
        type: string
        default: 9baeba459e6ea4c7ebd6c0694cb05fef4d36f401
        required: true
      compiler:
        description: I select the Linux compiler; Apple uses its qualified cc wrapper.
        type: choice
        options: [clang, gcc]
        default: clang
      native_darwin:
        description: I compare on the existing qualified Apple toolchain.
        type: boolean
        default: false
      sample_shadows:
        description: I sample one actual Apple shadow child instead of running the alternating comparison; this is diagnostic only.
        type: boolean
        default: false
      observe_processes:
        description: I retain read-only factory descendant snapshots during the six attempts; presence is not exact CPU time.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    name: Diagnostic only (${{ matrix.worker }})
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(github.event_name == 'push' && '["xcode-27"]' || (inputs.native_darwin && '["xcode-27"]' || '["ubuntu-latest"]')) }}
    runs-on: ${{ matrix.worker }}
    timeout-minutes: 120
    env:
      CC: ${{ matrix.worker == 'xcode-27' && 'cc' || inputs.compiler || 'clang' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require one diagnostic observation mode
        if: inputs.sample_shadows && inputs.observe_processes
        run: |
          echo 'I require separate CPU sampling and factory process observation.'
          exit 1
      - name: Require worker headroom before provisioning
        run: python3 scripts/compare_cseed_source_creation.py health --output .test_output/cseed-source-comparison
      - name: Install my existing Linux native prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: ./scripts/ci-apt-install.sh build-essential clang pkg-config libssl-dev libffi-dev
      - name: Install my existing Darwin native prerequisites
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: ./scripts/ci-brew-install.sh pkg-config openssl libffi
      - name: Select the existing qualified Apple compiler and SDK
        if: runner.os == 'macOS'
        run: python3 scripts/ci_select_capture_clang.py
      - name: Check actual observer process and native controls
        if: inputs.observe_processes
        run: python3 -m unittest -v tests.test_cseed_source_comparison tests.test_native_phase_trace
      - name: Retain all six planned actual factory attempts
        if: ${{ !inputs.sample_shadows }}
        env:
          BASELINE_SHA: ${{ inputs.baseline || '9baeba459e6ea4c7ebd6c0694cb05fef4d36f401' }}
        run: |
          ulimit -c 0
          observation=()
          if ${{ inputs.observe_processes && 'true' || 'false' }}; then
            observation+=(--observe-processes)
          fi
          python3 scripts/compare_cseed_source_creation.py run \
            --baseline "$BASELINE_SHA" --output .test_output/cseed-source-comparison "${observation[@]}"
      - name: Sample one actual Apple shadow child without native publication
        if: inputs.sample_shadows
        run: |
          ulimit -c 0
          python3 scripts/profile_cseed_source_shadows.py \
            --output .test_output/cseed-source-comparison/shadow-profile
      - name: Retain diagnostic evidence even when creation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cseed-source-comparison-${{ runner.os }}-${{ env.CC }}-${{ github.sha }}
          path: |
            .test_output/cseed-source-comparison/
            .test_output/retirement/capture-toolchain.json
            .test_output/retirement/selected-tools/
          include-hidden-files: true
          if-no-files-found: error
