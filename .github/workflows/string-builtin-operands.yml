name: Cached string builtin operand diagnosis

on:
  push:
    branches: [fix/5.1-string-builtin-operands, fix/5.1-declared-string-dispatch, fix/5.1-map-context-and-declared-c, fix/5.1-legacy-print-statements, fix/5.1-empty-record-array-context, fix/5.1-numeric-selection, fix/5.1-math-host-contracts, fix/5.1-stage-source-contracts]
    paths:
      - '.github/workflows/string-builtin-operands.yml'
      - 'src/env.c'
      - 'src/eval.c'
      - 'src/transpiler.c'
      - 'src/transpiler_iterative_v3_twopass.c'
      - 'tests/test_builtin_string_operands.py'
      - 'tests/test_canonical_string_builtins.py'
      - 'tests/test_legacy_print_statements.py'
      - 'tests/test_empty_record_array_contexts.py'
      - 'tests/test_numeric_builtin_selection.py'
      - 'tests/test_math_host_contracts.py'
      - 'tests/test_array_search_reverse_contracts.py'
      - 'tests/test_array_arithmetic_contracts.py'
      - 'tests/test_cast_float_contracts.py'
      - 'tests/test_dynamic_array_contracts.py'
      - 'tests/test_format_source_contracts.py'
      - 'tests/test_legacy_par_let_contracts.py'
      - 'tests/test_typechecker.c'
      - 'tests/test_map_constructor_contexts.py'
      - 'tests/unit/test_map_constructor_contexts.nano'
      - 'src/typechecker.c'
      - 'src/nanoisa/nvm2c.c'
      - 'src/nanoisa/nvm2c_shape.c'
      - 'src/nanoisa/nvm2c_shape.h'
      - 'tests/nanoisa/test_nvm2c_shape.c'
      - 'src/nanoisa/nvm2c_callables.c'
      - 'src/nanoisa/nvm2c_reachability.h'
      - 'schema/compiler_schema.json'
      - 'src_nano/parser.nano'
      - 'src_nano/typecheck.nano'
      - 'src_nano/typecheck_driver.nano'
      - 'tests/test_source_checker_component.py'
      - 'src_nano/compiler/nanoisa_codegen.nano'
      - 'src/math_host_contracts.h'
      - 'src/nanovirt/shadow_runner.c'
      - 'src/math_host_contracts.def'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  string-builtin-operands:
    name: Seed string operands, VM and C AOT (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    timeout-minutes: 90
    env:
      CC: ${{ matrix.compiler }}
      NANO_NATIVE_TEST_CC: ${{ matrix.compiler }}
      NANO_STRING_OPERAND_COMPILERS: nanoc_c,nano_virt
      NANO_PRINT_STATEMENT_COMPILERS: nanoc_c,nano_virt
      NANO_EMPTY_RECORD_PROVIDERS: nanoc_c,nano_virt
      NANO_NUMERIC_PROVIDERS: nano_virt
      NANO_MAP_CONTEXT_PROVIDERS: nanoc_c,nano_virt
      NANO_NVM2C_SHAPE_TRACE: 1
      NANOLANG_SELFHOST_COMPILER: ${{ github.workspace }}/bin/nano_virt
    steps:
      - uses: actions/checkout@v4
      - name: Require worker headroom before provisioning or building
        run: |
          python3 - <<'PY'
          import json, os, shutil, tempfile
          from pathlib import Path
          output = Path('.test_output/string-builtin-operands')
          output.mkdir(parents=True)
          disks = []
          for location in ['.', tempfile.gettempdir(), os.environ['RUNNER_TEMP'], '/var/cache/apt']:
              usage = shutil.disk_usage(location)
              disks.append({'path': location, 'free': usage.free, 'total': usage.total})
          memory = {line.split(':')[0]: int(line.split()[1]) * 1024
                    for line in Path('/proc/meminfo').read_text().splitlines()
                    if line.startswith(('MemTotal:', 'MemAvailable:'))}
          report = {'cpus': os.cpu_count(), 'disks': disks, 'memory': memory}
          (output / 'worker.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if any(row['free'] < 20 * 1024**3 or row['free'] / row['total'] < .10 for row in disks):
              raise SystemExit('I hold native compilation for insufficient disk headroom.')
          if memory['MemAvailable'] / memory['MemTotal'] <= .10:
              raise SystemExit('I hold native compilation for memory pressure.')
          PY
      - name: Install my existing native compiler prerequisites
        timeout-minutes: 20
        run: ./scripts/ci-apt-install.sh build-essential clang pkg-config libssl-dev libffi-dev
      - name: Build actual fresh VM and C AOT providers
        id: providers
        timeout-minutes: 25
        run: |
          set -o pipefail
          make -f Makefile.gnu -j2 CC="$CC" nanoisa_dump nano_vm nvm2c bin/nanoisa bin/nanoc_c nano_virt nvm2c-runtime \
            2>&1 | tee .test_output/string-builtin-operands/build.log
          git rev-parse HEAD > .test_output/string-builtin-operands/revision.txt
          git ls-tree -r HEAD > .test_output/string-builtin-operands/source-tree.txt
          sha256sum bin/nanoisa bin/nano_vm bin/nvm2c bin/nanoc_c bin/nano_virt bin/nano_aot_runtime.o > .test_output/string-builtin-operands/providers.sha256
          "$CC" --version > .test_output/string-builtin-operands/compiler.txt
      - name: Execute the complete original C typechecker unit suite
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-typechecker \
            2>&1 | tee .test_output/string-builtin-operands/typechecker.log
      - name: Execute my actual source checker native component through the C seed
        run: python3 -m unittest -v tests.test_source_checker_component
      - name: Verify exact and deferred aggregate shape constraints
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-nvm2c-shapes \
            2>&1 | tee .test_output/string-builtin-operands/shapes.log
      - name: Execute all operand methods and the complete canonical string suite
        timeout-minutes: 45
        run: |
          set -o pipefail
          python3 -m unittest -v tests.test_builtin_string_operands tests.test_canonical_string_builtins tests.test_legacy_print_statements tests.test_empty_record_array_contexts tests.test_numeric_builtin_selection tests.test_math_host_contracts tests.test_array_search_reverse_contracts tests.test_array_arithmetic_contracts tests.test_cast_float_contracts tests.test_dynamic_array_contracts tests.test_format_source_contracts tests.test_legacy_par_let_contracts tests.test_map_constructor_contexts \
            2>&1 | tee .test_output/string-builtin-operands/tests.log
      - name: Execute the complete original translator regression gate
        if: always() && steps.providers.outcome == 'success'
        timeout-minutes: 45
        run: |
          set -o pipefail
          python3 scripts/ci_qualification_storage.py run \
            --output .test_output/string-builtin-operands/translator-storage --label complete-translator -- \
            make -f Makefile.gnu CC="$CC" test-nvm2c \
            2>&1 | tee .test_output/string-builtin-operands/translator.log
      - name: Retain complete original array alias regression routes
        if: always() && steps.providers.outcome == 'success'
        timeout-minutes: 30
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path('.test_output/string-builtin-operands')
          results = []
          for provider, route in [('nanoc_c', 'source-native'), ('nano_virt', 'canonical')]:
              command = [sys.executable, '-m', 'unittest', '-v', 'tests.test_array_builtin_aliases']
              with (output / (provider + '-array-aliases.log')).open('w') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT,
                      env=dict(os.environ, NANOLANG_ARRAY_ALIAS_COMPILERS=str(Path('bin', provider).resolve()),
                               NANOLANG_ARRAY_ALIAS_ROUTE=route))
              results.append({'provider': provider, 'route': route, 'argv': command, 'returncode': result.returncode})
              (output / 'array-alias-results.json').write_text(json.dumps(results, indent=2) + '\n')
          raise SystemExit(int(any(row['returncode'] != 0 for row in results)))
          PYCODE
      - name: Verify unchanged sources and providers
        if: always()
        run: |
          git diff --exit-code
          if test -f .test_output/string-builtin-operands/providers.sha256; then
            sha256sum --check .test_output/string-builtin-operands/providers.sha256 \
              > .test_output/string-builtin-operands/providers-after.log
          fi
      - name: Retain original build and diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-builtin-operands-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            .test_output/string-builtin-operands/
            .test_output/source-checker-component/
            .test_output/legacy-print-statements/
            .test_output/empty-record-array-contexts/
            .test_output/numeric-builtin-selection/
            .test_output/map-constructor-contexts/
          include-hidden-files: true
          if-no-files-found: error
