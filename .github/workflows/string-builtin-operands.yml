name: Cached string builtin operand diagnosis

on:
  push:
    branches: [fix/5.1-string-builtin-operands, fix/5.1-declared-string-dispatch, fix/5.1-map-context-and-declared-c, fix/5.1-legacy-print-statements, fix/5.1-empty-record-array-context, fix/5.1-numeric-selection, fix/5.1-math-host-contracts, fix/5.1-stage-source-contracts]
    paths:
      - '.github/workflows/string-builtin-operands.yml'
      - 'src/env.c'
      - 'tests/test_env_symbol_index.c'
      - 'src/runtime/gc.c'
      - 'tests/test_gc_struct.c'
      - 'src/eval.c'
      - 'src/eval/bstring_intrinsics.inc'
      - 'tests/test_eval_bstring.c'
      - 'src/eval/eval_io.c'
      - 'src/nanolang.h'
      - 'src/transpiler.c'
      - 'src/stdlib_runtime.c'
      - 'src/stdlib_runtime.h'
      - 'src/transpiler_iterative_v3_twopass.c'
      - 'tests/test_builtin_string_operands.py'
      - 'tests/test_canonical_string_builtins.py'
      - 'tests/test_legacy_print_statements.py'
      - 'tests/test_empty_record_array_contexts.py'
      - 'tests/test_numeric_builtin_selection.py'
      - 'tests/test_math_host_contracts.py'
      - 'tests/test_array_search_reverse_contracts.py'
      - 'tests/test_array_arithmetic_contracts.py'
      - 'tests/test_cast_float_contracts.py'
      - 'tests/test_dynamic_array_contracts.py'
      - 'tests/test_format_source_contracts.py'
      - 'tests/test_legacy_par_let_contracts.py'
      - 'tests/test_anonymous_record_contracts.py'
      - 'tests/test_byte_alias_contracts.py'
      - 'tests/test_character_builtin_contracts.py'
      - 'tests/test_u8_argument_contracts.py'
      - 'tests/test_string_stdlib_contracts.py'
      - 'tests/test_uppercase_condition_contracts.py'
      - 'tests/test_legacy_bang_contracts.py'
      - 'tests/test_array_sort_contracts.py'
      - 'tests/test_byte_conversion_contracts.py'
      - 'tests/test_environment_contracts.py'
      - 'src/bstring_contracts.h'
      - 'src/nanovm/bstring_intrinsics.inc'
      - 'src/runtime/nl_string.c'
      - 'src/runtime/nl_string.h'
      - 'src/nanovm/heap.c'
      - 'src/nanovm/heap.h'
      - 'src/nanovm/value.h'
      - 'src/nanovm/vm_ffi.c'
      - 'tests/nanovm/test_bstring_contracts.c'
      - 'tests/test_bstring_vm_contracts.py'
      - 'tests/test_bstring_c_contracts.py'
      - 'tests/test_nl_string.c'
      - 'Makefile.gnu'
      - 'scripts/diagnose_bstring_contracts.py'
      - 'tests/test_compiler_phase_marker_contracts.py'
      - 'scripts/native_phase_trace.py'
      - 'src_nano/compiler/native_product.nano'
      - 'src_nano/nanoc_v06.nano'
      - 'tests/test_typechecker.c'
      - 'tests/test_map_constructor_contexts.py'
      - 'tests/unit/test_map_constructor_contexts.nano'
      - 'src/typechecker.c'
      - 'src/nanovirt/codegen.c'
      - 'src/parser.c'
      - 'tests/test_parser.c'
      - 'src/nanoisa/nvm2c.c'
      - 'tests/nanoisa/test_nvm2c_callables.c'
      - 'src/nanoisa/nvm2c_shape.c'
      - 'src/nanoisa/nvm2c_shape.h'
      - 'tests/nanoisa/test_nvm2c_shape.c'
      - 'src/nanoisa/nvm2c_callables.c'
      - 'src/nanoisa/nvm2c_reachability.h'
      - 'schema/compiler_schema.json'
      - 'src_nano/compiler/lexer.nano'
      - 'src_nano/parser.nano'
      - 'src_nano/typecheck.nano'
      - 'src_nano/typecheck_driver.nano'
      - 'spec/reserved_builtin_names.json'
      - 'scripts/gen_reserved_builtins.py'
      - 'src/generated/reserved_builtin_names.h'
      - 'src_nano/generated/reserved_builtin_names.nano'
      - 'tests/test_source_checker_component.py'
      - 'src_nano/compiler/nanoisa_codegen.nano'
      - 'src/math_host_contracts.h'
      - 'src/nanovirt/shadow_runner.c'
      - 'src/math_host_contracts.def'
  workflow_dispatch:
    inputs:
      native_darwin:
        description: I execute the same component gates on my existing qualified Apple toolchain.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  string-builtin-operands:
    name: Seed string operands, VM and C AOT (${{ matrix.compiler }})
    runs-on: ${{ inputs.native_darwin && 'xcode-27' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJSON(inputs.native_darwin && '["cc"]' || '["gcc","clang"]') }}
    timeout-minutes: 90
    env:
      CC: ${{ matrix.compiler }}
      NANO_NATIVE_TEST_CC: ${{ matrix.compiler }}
      NANO_STRING_OPERAND_COMPILERS: nanoc_c,nano_virt
      NANO_PRINT_STATEMENT_COMPILERS: nanoc_c,nano_virt
      NANO_EMPTY_RECORD_PROVIDERS: nanoc_c,nano_virt
      NANO_NUMERIC_PROVIDERS: nano_virt
      NANO_MAP_CONTEXT_PROVIDERS: nanoc_c,nano_virt
      NANO_NVM2C_SHAPE_TRACE: 1
      NANOLANG_SELFHOST_COMPILER: ${{ github.workspace }}/bin/nano_virt
    steps:
      - uses: actions/checkout@v4
      - name: Require worker headroom before provisioning or building
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys, tempfile
          from pathlib import Path
          output = Path('.test_output/string-builtin-operands')
          output.mkdir(parents=True)
          disks = []
          cache = str(Path.home()/'Library/Caches/Homebrew') if sys.platform == 'darwin' else '/var/cache/apt'
          for location in ['.', tempfile.gettempdir(), os.environ['RUNNER_TEMP'], cache]:
              existing = Path(location)
              while not existing.exists():
                  existing = existing.parent
              usage = shutil.disk_usage(existing)
              disks.append({'path': location, 'free': usage.free, 'total': usage.total})
          if sys.platform == 'darwin':
              page_output = subprocess.check_output(['vm_stat'], text=True)
              pages = {line.split(':')[0]: int(line.split(':')[1].strip().rstrip('.'))
                       for line in page_output.splitlines()[1:] if ':' in line}
              page_size = int(subprocess.check_output(['sysctl', '-n', 'hw.pagesize'], text=True))
              total = int(subprocess.check_output(['sysctl', '-n', 'hw.memsize'], text=True))
              available = page_size * sum(pages.get(name, 0) for name in
                  ['Pages free', 'Pages inactive', 'Pages speculative'])
              memory = {'MemTotal': total, 'MemAvailable': available}
          else:
              memory = {line.split(':')[0]: int(line.split()[1]) * 1024
                        for line in Path('/proc/meminfo').read_text().splitlines()
                        if line.startswith(('MemTotal:', 'MemAvailable:'))}
          report = {'cpus': os.cpu_count(), 'disks': disks, 'memory': memory}
          (output / 'worker.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if any(row['free'] < 20 * 1024**3 or row['free'] / row['total'] < .10 for row in disks):
              raise SystemExit('I hold native compilation for insufficient disk headroom.')
          if memory['MemAvailable'] / memory['MemTotal'] <= .10:
              raise SystemExit('I hold native compilation for memory pressure.')
          PY
      - name: Install my existing Linux native compiler prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: ./scripts/ci-apt-install.sh build-essential clang pkg-config libssl-dev libffi-dev
      - name: Install my existing Darwin native compiler prerequisites
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: ./scripts/ci-brew-install.sh pkg-config openssl libffi
      - name: Select my existing qualified Apple compiler and SDK without drift
        if: runner.os == 'macOS'
        run: python3 scripts/ci_select_capture_clang.py
      - name: Verify my shared reserved-definition tables
        run: python3 scripts/gen_reserved_builtins.py --check
      - name: Build actual fresh VM and C AOT providers
        id: providers
        timeout-minutes: 25
        run: |
          set -o pipefail
          make -f Makefile.gnu -j2 CC="$CC" nanoisa_dump nano_vm nvm2c bin/nanoisa bin/nanoc_c nano_virt nvm2c-runtime \
            2>&1 | tee .test_output/string-builtin-operands/build.log
          git rev-parse HEAD > .test_output/string-builtin-operands/revision.txt
          git ls-tree -r HEAD > .test_output/string-builtin-operands/source-tree.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          paths = ['bin/nanoisa', 'bin/nano_vm', 'bin/nvm2c', 'bin/nanoc_c', 'bin/nano_virt', 'bin/nano_aot_runtime.o']
          manifest = ''.join(hashlib.sha256(Path(path).read_bytes()).hexdigest()+'  '+path+'\n' for path in paths)
          Path('.test_output/string-builtin-operands/providers.sha256').write_text(manifest)
          PY
          "$CC" --version > .test_output/string-builtin-operands/compiler.txt
      - name: Execute my existing C lexer fixture controls
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-embedded-nano-identifiers \
            2>&1 | tee .test_output/string-builtin-operands/lexer.log
      - name: Execute the complete original C parser unit suite
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-parser \
            2>&1 | tee .test_output/string-builtin-operands/parser.log
      - name: Execute the complete original C typechecker unit suite
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-typechecker \
            2>&1 | tee .test_output/string-builtin-operands/typechecker.log
      - name: Execute my existing environment index and STRING ownership controls
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-env-symbol-index \
            2>&1 | tee .test_output/string-builtin-operands/environment.log
      - name: Execute my binary-string ownership and VM semantic gates
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-nanovm test-nl-string-bounds-sanitizers test-eval-bstring-sanitizers test-gc-shutdown-sanitizers \
            2>&1 | tee .test_output/string-builtin-operands/bstring-ownership.log
          python3 -m unittest -v tests.test_record_map_heap tests.test_record_map_string_heap tests.test_record_map_ordinary_heap \
            2>&1 | tee .test_output/string-builtin-operands/bstring-private-heap.log
          python3 -m unittest -v tests.test_bstring_vm_contracts tests.test_bstring_c_contracts \
            2>&1 | tee .test_output/string-builtin-operands/bstring-vm.log
      - name: Retain current C and VM bstring boundary baselines
        run: |
          python3 scripts/diagnose_bstring_contracts.py --output .test_output/bstring-contract-baselines
      - name: Execute my actual source checker native component through the C seed
        id: checker_component
        env:
          NANO_SHADOW_TRACE: '1'
        run: python3 -m unittest -v tests.test_source_checker_component
      - name: Verify exact and deferred aggregate shape constraints
        run: |
          set -o pipefail
          make -f Makefile.gnu CC="$CC" test-nvm2c-shapes \
            2>&1 | tee .test_output/string-builtin-operands/shapes.log
      - name: Execute all operand methods and the complete canonical string suite
        timeout-minutes: 45
        run: |
          set -o pipefail
          python3 -m unittest -v tests.test_builtin_string_operands tests.test_canonical_string_builtins tests.test_legacy_print_statements tests.test_empty_record_array_contexts tests.test_numeric_builtin_selection tests.test_math_host_contracts tests.test_array_search_reverse_contracts tests.test_array_arithmetic_contracts tests.test_cast_float_contracts tests.test_dynamic_array_contracts tests.test_format_source_contracts tests.test_legacy_par_let_contracts tests.test_anonymous_record_contracts tests.test_byte_alias_contracts tests.test_character_builtin_contracts tests.test_u8_argument_contracts tests.test_compiler_phase_marker_contracts tests.test_string_stdlib_contracts tests.test_uppercase_condition_contracts tests.test_legacy_bang_contracts tests.test_array_sort_contracts tests.test_byte_conversion_contracts tests.test_environment_contracts tests.test_map_constructor_contexts \
            2>&1 | tee .test_output/string-builtin-operands/tests.log
      - name: Retain checker and focused-source attempt metadata before the translator gate
        if: always() && steps.providers.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-attempt-metadata-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            .test_output/string-builtin-operands/build.log
            .test_output/string-builtin-operands/parser.log
            .test_output/string-builtin-operands/typechecker.log
            .test_output/string-builtin-operands/bstring-private-heap.log
            .test_output/string-builtin-operands/bstring-ownership.log
            .test_output/string-builtin-operands/bstring-vm.log
            .test_output/string-builtin-operands/environment.log
            .test_output/string-builtin-operands/tests.log
            .test_output/source-checker-component/**/*.json
            .test_output/source-checker-component/**/*.jsonl
            .test_output/source-checker-component/**/*.stdout
            .test_output/source-checker-component/**/*.stderr
            .test_output/bstring-c-contracts/
            .test_output/bstring-vm-contracts/
            .test_output/bstring-contract-baselines/**/*.json
            .test_output/bstring-contract-baselines/**/*.stdout
            .test_output/bstring-contract-baselines/**/*.stderr
            .test_output/numeric-builtin-selection/**/*.json
            .test_output/numeric-builtin-selection/**/*.jsonl
            .test_output/numeric-builtin-selection/**/*.stdout
            .test_output/numeric-builtin-selection/**/*.stderr
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Execute the complete original translator regression gate
        if: always() && steps.providers.outcome == 'success'
        timeout-minutes: 45
        run: |
          set -o pipefail
          python3 scripts/ci_qualification_storage.py run \
            --output .test_output/string-builtin-operands/translator-storage --label complete-translator -- \
            make -f Makefile.gnu CC="$CC" test-nvm2c \
            2>&1 | tee .test_output/string-builtin-operands/translator.log
      - name: Retain complete original array alias regression routes
        if: always() && steps.providers.outcome == 'success'
        timeout-minutes: 30
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path('.test_output/string-builtin-operands')
          results = []
          for provider, route in [('nanoc_c', 'source-native'), ('nano_virt', 'canonical')]:
              command = [sys.executable, '-m', 'unittest', '-v', 'tests.test_array_builtin_aliases']
              with (output / (provider + '-array-aliases.log')).open('w') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT,
                      env=dict(os.environ, NANOLANG_ARRAY_ALIAS_COMPILERS=str(Path('bin', provider).resolve()),
                               NANOLANG_ARRAY_ALIAS_ROUTE=route))
              results.append({'provider': provider, 'route': route, 'argv': command, 'returncode': result.returncode})
              (output / 'array-alias-results.json').write_text(json.dumps(results, indent=2) + '\n')
          raise SystemExit(int(any(row['returncode'] != 0 for row in results)))
          PYCODE
      - name: Verify unchanged sources and providers
        if: always()
        run: |
          git diff --exit-code
          if test -f .test_output/string-builtin-operands/providers.sha256; then
            python3 - <<'PY'
          import hashlib
          from pathlib import Path
          report = []
          for row in Path('.test_output/string-builtin-operands/providers.sha256').read_text().splitlines():
              expected, path = row.split('  ', 1)
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit('I refuse a changed provider: '+path)
              report.append(path+': OK')
          Path('.test_output/string-builtin-operands/providers-after.log').write_text('\n'.join(report)+'\n')
          PY
          fi
      - name: Retain original build and diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-builtin-operands-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            .test_output/string-builtin-operands/
            .test_output/source-checker-component/
            .test_output/retirement/capture-toolchain.json
            .test_output/retirement/selected-tools/
            .test_output/legacy-print-statements/
            .test_output/empty-record-array-contexts/
            .test_output/numeric-builtin-selection/
            .test_output/bstring-contract-baselines/
            .test_output/compiler-phase-markers/
            .test_output/map-constructor-contexts/
          include-hidden-files: true
          if-no-files-found: error
