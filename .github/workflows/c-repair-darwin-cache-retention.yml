name: Original Darwin cache with repaired retention
'on':
  push:
    branches:
    - work/5.1-darwin-cache-retention-20261128
    paths:
    - .github/workflows/c-repair-darwin-cache-retention.yml
    - scripts/ci_darwin_cache_retention.py
    - scripts/ci_original_qualification_policy.py
    - tests/test_ci_darwin_cache_retention.py
  workflow_dispatch: null
permissions:
  contents: read
env:
  PRODUCT_REVISION: ddd3b5a4ff35678d1906c07c08fc6bbc39b041de
jobs:
  original-darwin-cache:
    name: Original Darwin cache with bounded retention
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
        - xcode-27
        gate:
        - cache
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
    - name: Require a hosted worker before provisioning
      id: hosted
      run: |
        test '${{ runner.environment }}' = github-hosted
        uname -a
        echo "I qualify $PRODUCT_REVISION with observer $GITHUB_SHA on $RUNNER_NAME."
      working-directory: .
    - name: Check out my collector observer
      uses: actions/checkout@v4
      with:
        path: observer
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /scripts/ci_darwin_cache_retention.py
          /scripts/ci_original_qualification_policy.py
          /tests/test_ci_darwin_cache_retention.py
          /.github/workflows/c-repair-original-gates.yml
          /.github/workflows/c-repair-darwin-cache-retention.yml
    - name: Check out Darwin product and original test inputs
      if: runner.os == 'macOS'
      uses: actions/checkout@v4
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/docs/evidence/
        path: product
        ref: ${{ env.PRODUCT_REVISION }}
    - name: Require storage headroom
      run: |
        python3 - <<'PY'
        import os, shutil, tempfile
        for path in ['.', tempfile.gettempdir(), os.environ['RUNNER_TEMP']]:
            disk = shutil.disk_usage(path)
            assert disk.free >= 20*1024**3 and disk.free/disk.total >= .10, (path, disk)
        PY
    - name: Install Darwin dependencies
      if: runner.os == 'macOS'
      timeout-minutes: 20
      run: |
        ./scripts/ci-brew-install.sh pkg-config openssl sqlite sdl2 \
          sdl2_image sdl2_mixer sdl2_ttf utf8proc
    - name: Select the pinned Darwin compiler and SDK
      if: runner.os == 'macOS'
      run: python3 scripts/ci_select_capture_clang.py
    - name: Install Python dependencies
      run: |
        python3 -c 'import yaml' 2>/dev/null && exit 0
        python3 -m pip install --user pyyaml \
          || python3 -m pip install --user --break-system-packages pyyaml
        python3 -c 'import yaml'
    - name: Verify my exact original product pin
      id: pin
      run: |
        test "$(git rev-parse HEAD)" = "$PRODUCT_REVISION"
    - name: Test my collector before original product execution
      id: observer
      working-directory: observer
      run: |
        python3 -m unittest discover -s tests -p test_ci_darwin_cache_retention.py -v
    - name: Record source and tool identities
      run: |
        mkdir -p .test_output/c-repair-original-gates
        git rev-parse HEAD > .test_output/c-repair-original-gates/revision.txt
        git ls-tree -r HEAD > .test_output/c-repair-original-gates/source-tree.txt
        python3 - <<'PY'
        import hashlib, json, os, shlex, shutil, subprocess
        from pathlib import Path
        root=Path('.test_output/c-repair-original-gates')
        compiler=shlex.split(os.environ.get('CC','cc'))
        version=subprocess.check_output(compiler+['--version'])
        (root/'compiler-version.txt').write_bytes(version)
        selected=[compiler[0],'as','ld','make','python3']
        for tool in ('as','ld'):
            selected.append(subprocess.check_output(compiler+['-print-prog-name='+tool]).decode().strip())
        tools={str(Path(shutil.which(n)).resolve()) for n in selected}
        hashes={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in tools}
        (root/'tools-before.json').write_text(json.dumps(hashes,indent=2)+'\n')
        copies=root/'selected-tools';copies.mkdir()
        for i,n in enumerate(sorted(tools)):
            copy=copies/(str(i)+'-'+Path(n).name)
            shutil.copyfile(n,copy)
            assert hashlib.sha256(copy.read_bytes()).hexdigest()==hashes[n]
        PY
    - name: Build fresh production tools
      timeout-minutes: 10
      run: |
        set -o pipefail
        make -f Makefile.gnu -j2 CC="${CC:-cc}" bin/nanoc_c nano_virt nano_vm \
          nvm2c nanoisa_dump nvm2c-runtime \
          2>&1 | tee .test_output/c-repair-original-gates/cold-tools.log
        python3 - <<'PY'
        import hashlib,json
        from pathlib import Path
        names=['nanoc_c','nano_virt','nano_vm','nvm2c','nanoisa','nano_aot_runtime.o']
        if Path('bin/nano_as_capture.so').is_file():names.append('nano_as_capture.so')
        hashes={n:hashlib.sha256((Path('bin')/n).read_bytes()).hexdigest() for n in names}
        Path('.test_output/c-repair-original-gates/images-before.json').write_text(json.dumps(hashes,indent=2)+'\n')
        PY
      id: build
    - name: Check managed STRING publication and exact alias retention
      timeout-minutes: 10
      run: |
        set -o pipefail
        make -f Makefile.gnu -j1 CC="${CC:-cc}" test-env-string-binding-hint test-env-symbol-index test-eval-builtin-resolution \
          test-checker-rejected-declarations test-checker-rejected-declaration-cli test-function-depth-batch test-eval-string-split \
          test-gc-registry-working-set test-gc-registry-working-set-sanitizers test-gc-shutdown-sanitizers test-eval-caller-root-handoff test-native-root-insertion test-shape-flow-scaling test-nvm2c-shapes \
          2>&1 | tee .test_output/c-repair-original-gates/string-binding-regression.log
      id: regression
    - name: Execute my array repair regression
      if: matrix.gate == 'cache'
      timeout-minutes: 10
      run: |
        set -o pipefail
        python3 -m unittest -v tests.test_native_array_write_inference tests.test_native_record_pointer_storage \
          2>&1 | tee .test_output/c-repair-original-gates/array-regression.log
      id: array
    - name: Execute the complete original cache and worker gates
      if: matrix.gate == 'cache'
      timeout-minutes: 150
      run: |
        set -o pipefail
        python3 scripts/ci_qualification_storage.py run --label original-cache-workers -- \
          make -f Makefile.gnu -j1 CC="${CC:-cc}" test-bytecode-shadows test-module-assembly-workers \
          2>&1 | tee .test_output/c-repair-original-gates/cache-workers.log
      id: cache
    - name: Verify source and selected tool guards
      if: always() && steps.hosted.outcome == 'success'
      run: |
        git diff --exit-code HEAD
        python3 - <<'PY'
        import hashlib,json
        from pathlib import Path
        root=Path('.test_output/c-repair-original-gates')
        for name,base in [('tools',Path('/')),('images',Path('bin'))]:
            before=root/(name+'-before.json')
            if not before.exists():continue
            expected=json.loads(before.read_text())
            actual={n:hashlib.sha256((base/n).read_bytes()).hexdigest() for n in expected}
            (root/(name+'-after.json')).write_text(json.dumps(actual,indent=2)+'\n')
            assert actual==expected,(name,expected,actual)
        PY
      id: guards
    - name: Print retained bootstrap failure logs
      if: failure() && steps.hosted.outcome == 'success'
      run: |
        python3 - <<'PY'
        from pathlib import Path
        for path in sorted(Path('obj/bootstrap-nanoisa').glob('run-*/*.log')):
            print(str(path),flush=True)
            print(path.read_text(errors='replace')[-32000:],flush=True)
        PY
    - name: Retain original Darwin cache payload attempt1
      if: always() && steps.hosted.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: c-repair-original-xcode-27-cache-${{ env.PRODUCT_REVISION }}-observer-${{ github.sha }}-attempt1
        path: |
          product/.test_output/
          product/bin/nanoc*
          product/bin/nano_vm
          product/bin/nano_virt
          product/bin/nvm2c
          product/bin/nanoisa
          product/bin/nano_aot_runtime.o
          product/bin/nano_as_capture.so
          product/obj/bootstrap-nanoisa/
          product/obj/module_cache/
          product/modules/index.json
          product/modules/**/.build/**
          ${{ runner.temp }}/nano-*/
          observer/scripts/ci_darwin_cache_retention.py
          observer/scripts/ci_original_qualification_policy.py
          observer/tests/test_ci_darwin_cache_retention.py
          observer/.github/workflows/c-repair-darwin-cache-retention.yml
          observer/.github/workflows/c-repair-original-gates.yml
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
      id: retain_1
      continue-on-error: true
    - name: Record retention outcomes before attempt2
      if: always() && steps.hosted.outcome == 'success' && steps.retain_1.outcome == 'failure'
      env:
        RETENTION_1: ${{ steps.retain_1.outcome }}
        RETENTION_2: ${{ steps.retain_2.outcome }}
        RETENTION_3: ${{ steps.retain_3.outcome }}
        CACHE_GATE_PIN: ${{ steps.pin.outcome }}
        CACHE_GATE_OBSERVER: ${{ steps.observer.outcome }}
        CACHE_GATE_BUILD: ${{ steps.build.outcome }}
        CACHE_GATE_REGRESSION: ${{ steps.regression.outcome }}
        CACHE_GATE_ARRAY: ${{ steps.array.outcome }}
        CACHE_GATE_CACHE: ${{ steps.cache.outcome }}
        CACHE_GATE_GUARDS: ${{ steps.guards.outcome }}
      run: |
        python3 ../observer/scripts/ci_darwin_cache_retention.py --observe-only --output .test_output/c-repair-original-gates/retention-observed.json
    - name: Retain original Darwin cache payload attempt2
      if: always() && steps.hosted.outcome == 'success' && steps.retain_1.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: c-repair-original-xcode-27-cache-${{ env.PRODUCT_REVISION }}-observer-${{ github.sha }}-attempt2
        path: |
          product/.test_output/
          product/bin/nanoc*
          product/bin/nano_vm
          product/bin/nano_virt
          product/bin/nvm2c
          product/bin/nanoisa
          product/bin/nano_aot_runtime.o
          product/bin/nano_as_capture.so
          product/obj/bootstrap-nanoisa/
          product/obj/module_cache/
          product/modules/index.json
          product/modules/**/.build/**
          ${{ runner.temp }}/nano-*/
          observer/scripts/ci_darwin_cache_retention.py
          observer/scripts/ci_original_qualification_policy.py
          observer/tests/test_ci_darwin_cache_retention.py
          observer/.github/workflows/c-repair-darwin-cache-retention.yml
          observer/.github/workflows/c-repair-original-gates.yml
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
      id: retain_2
      continue-on-error: true
    - name: Record retention outcomes before attempt3
      if: always() && steps.hosted.outcome == 'success' && steps.retain_2.outcome == 'failure'
      env:
        RETENTION_1: ${{ steps.retain_1.outcome }}
        RETENTION_2: ${{ steps.retain_2.outcome }}
        RETENTION_3: ${{ steps.retain_3.outcome }}
        CACHE_GATE_PIN: ${{ steps.pin.outcome }}
        CACHE_GATE_OBSERVER: ${{ steps.observer.outcome }}
        CACHE_GATE_BUILD: ${{ steps.build.outcome }}
        CACHE_GATE_REGRESSION: ${{ steps.regression.outcome }}
        CACHE_GATE_ARRAY: ${{ steps.array.outcome }}
        CACHE_GATE_CACHE: ${{ steps.cache.outcome }}
        CACHE_GATE_GUARDS: ${{ steps.guards.outcome }}
      run: |
        python3 ../observer/scripts/ci_darwin_cache_retention.py --observe-only --output .test_output/c-repair-original-gates/retention-observed.json
    - name: Retain original Darwin cache payload attempt3
      if: always() && steps.hosted.outcome == 'success' && steps.retain_2.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: c-repair-original-xcode-27-cache-${{ env.PRODUCT_REVISION }}-observer-${{ github.sha }}-attempt3
        path: |
          product/.test_output/
          product/bin/nanoc*
          product/bin/nano_vm
          product/bin/nano_virt
          product/bin/nvm2c
          product/bin/nanoisa
          product/bin/nano_aot_runtime.o
          product/bin/nano_as_capture.so
          product/obj/bootstrap-nanoisa/
          product/obj/module_cache/
          product/modules/index.json
          product/modules/**/.build/**
          ${{ runner.temp }}/nano-*/
          observer/scripts/ci_darwin_cache_retention.py
          observer/scripts/ci_original_qualification_policy.py
          observer/tests/test_ci_darwin_cache_retention.py
          observer/.github/workflows/c-repair-darwin-cache-retention.yml
          observer/.github/workflows/c-repair-original-gates.yml
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
      id: retain_3
      continue-on-error: true
    - name: Require retained bytes and every original gate
      if: always() && steps.hosted.outcome == 'success'
      env:
        RETENTION_1: ${{ steps.retain_1.outcome }}
        RETENTION_2: ${{ steps.retain_2.outcome }}
        RETENTION_3: ${{ steps.retain_3.outcome }}
        CACHE_GATE_PIN: ${{ steps.pin.outcome }}
        CACHE_GATE_OBSERVER: ${{ steps.observer.outcome }}
        CACHE_GATE_BUILD: ${{ steps.build.outcome }}
        CACHE_GATE_REGRESSION: ${{ steps.regression.outcome }}
        CACHE_GATE_ARRAY: ${{ steps.array.outcome }}
        CACHE_GATE_CACHE: ${{ steps.cache.outcome }}
        CACHE_GATE_GUARDS: ${{ steps.guards.outcome }}
      run: |
        python3 ../observer/scripts/ci_darwin_cache_retention.py --output .test_output/c-repair-original-gates/retention-terminal.json
